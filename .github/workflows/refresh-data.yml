name: Refresh NFL data and publish the site

# Runs after every game window, plus the full Tuesday refresh, and publishes the
# site to GitHub Pages. Times are UTC (ET is UTC-4 until Nov 1, UTC-5 after).
on:
  schedule:
    - cron: '0 9 * * 5'    # Fri  ~5am ET  after Thursday Night Football
    - cron: '0 5 * * 0'    # Sun  ~1am ET  after Saturday games (Dec/Jan)
    - cron: '0 22 * * 0'   # Sun  ~6pm ET  after the 1pm (and London) games
    - cron: '30 1 * * 1'   # Mon  ~9:30pm ET Sun  after the 4pm games
    - cron: '0 5 * * 1'    # Mon  ~1am ET  after Sunday Night Football
    - cron: '0 12 * * 1'   # Mon  ~8am ET  overnight stat corrections and play-by-play
    - cron: '0 5 * * 2'    # Tue  ~1am ET  after Monday Night Football
    - cron: '0 13 * * 2'   # Tue  ~9am ET  full weekly refresh (corrections, snaps, charting)
  push:
    branches: [main]
    paths-ignore: ['HANDOFF.md', 'README.md']
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-publish
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the data files
        run: python3 build_data.py

      - name: Commit updated data if it changed
        run: |
          git config user.name "nfl-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nfl_data.json nfl_h2h.json nfl_allowed.json nfl_script.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data refresh: $(date -u '+%F %H:%M') UTC"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  publish:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the data commit the refresh job just pushed

      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html nfl_data.json nfl_h2h.json nfl_allowed.json nfl_script.json _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
