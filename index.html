/* what the next opponent does against this stat, linked to the games behind it */
function ldNext(p,o,k){
  if(isDef(p))return oppNote(p,o);
  const pos=p.p,kk=k==='lru'||k==='lr'?k:k==='ypc'?'ryd':k==='ypt'||k==='tshr'?'recyd':k==='ypa'||k==='cmpp'?'pyd':k==='scy'?(pos==='WR'||pos==='TE'?'recyd':'ryd'):k==='tdt'?(pos==='WR'||pos==='TE'?'rectd':'rtd'):k==='g300'?'pyd':k==='g100r'?'ryd':k==='g100c'?'recyd':k;
  const has=DA_ALL[pos]&&DA_ALL[pos].find(y=>y[0]===kk);
  if(!has||!DA[o]||!DA[o][pos])return oppNote(p,o);
  const v=DA[o][pos][kk],r=daRank(o,pos,kk);
  return alink(o,pos,kk,'allows '+fx(v,/td|int|x20/.test(kk)?2:1)+' '+(AL_SHORT[kk]||has[1].toLowerCase()))+' to '+pos+'s'+(r?', '+mup(r).replace(', a friendly matchup',', friendly').replace(', a tough matchup',', tough'):'');
}

/* ======================================================================
   Prop research for the coming week: projections from the Outlook model,
   plus the matchups that move the numbers most. Used on This week and Props.
   ====================================================================== */
const MAIN_PROP={QB:'pyd',RB:'ryd',WR:'recyd',TE:'recyd'};
function propWeek(){
  const wks=[...new Set(GAMES.filter(g=>!isFinal(g)).map(g=>g.wk))].sort((a,b)=>a-b);if(!wks.length)return null;
  const left=w=>GAMES.filter(g=>g.wk===w&&!isFinal(g)).length;return left(wks[0])<4&&wks[1]?wks[1]:wks[0];
}
function propResearch(n){
  const wk=propWeek();if(!wk)return '';
  const rows=[];
  OFF_POS.forEach(pos=>PLAYERS.filter(p=>p.p===pos&&qualifies(p)).forEach(p=>{
    const g=GAMES.find(x=>x.wk===wk&&!isFinal(x)&&(x.home===p.t||x.away===p.t));if(!g)return;
    const pr=project(p,g),x=pr.keys[MAIN_PROP[pos]];if(x)rows.push({p:p,g:g,o:pr.opp,k:MAIN_PROP[pos],x:x});}));
  if(!rows.length)return '';
  const li=r=>'<li><span>'+plink(r.p)+'<small>'+flag(r.p.t,'sm')+' '+(r.g.home===r.p.t?'vs ':'at ')+r.o+', avg '+pfmt(r.k,r.x.base)+'</small></span><span class="v">'+pfmt(r.k,r.x.proj)+' '+fct(r.x.f,r.k)+'</span></li>';
  let h='<h2>Prop research: week '+wk+'</h2><p class="lede">Projected '+'per game from each player’s full sample since '+(HIST[0]||SEASON)+', adjusted for the defense he faces and the betting market’s team total. The percentage is how much the matchup moves him. <a href="#/outlook">Every player and stat in Outlook</a>.</p><div class="ldr">'+
    OFF_POS.map(pos=>{const rs=rows.filter(r=>r.p.p===pos).sort((a,b)=>b.x.proj-a.x.proj).slice(0,n||5);
      return '<div><h3>'+pos+'s, '+glab(ST[MAIN_PROP[pos]].l,MAIN_PROP[pos])+'</h3><ol>'+rs.map(li).join('')+'</ol></div>';}).join('')+'</div>';
  const vol=rows.filter(r=>r.x.n>=4);
  const up=vol.slice().sort((a,b)=>b.x.f-a.x.f).slice(0,6),dn=vol.slice().sort((a,b)=>a.x.f-b.x.f).slice(0,6);
  const mv=r=>'<li><span>'+plink(r.p)+'<small>'+r.p.p+', '+(r.g.home===r.p.t?'vs ':'at ')+r.o+': '+alink(r.o,r.p.p,r.k,'allows '+pfmt(r.k,r.x.da))+' '+esc(ST[r.k].l.toLowerCase())+' to '+r.p.p+'s</small></span><span class="v">'+fct(r.x.f,r.k)+'</span></li>';
  h+='<h3 style="margin-top:20px">Matchups moving the numbers most</h3><div class="ldr" style="margin-top:8px"><div><h3>Biggest boost</h3><ol>'+up.map(mv).join('')+'</ol></div><div><h3>Biggest drop</h3><ol>'+dn.map(mv).join('')+'</ol></div></div>';
  return h;
}

/* ======================================================================
   Fantasy (PPR). Kept apart from prop research on purpose: props ask
   "will this one stat clear a line?", fantasy asks "how many total points,
   how reliably, and how much opportunity?".
   ====================================================================== */
const FT={pos:'RB',wk:null};
const FP_W={pyd:0.04,ptd:4,int:-2,ryd:0.1,rtd:6,rec:1,recyd:0.1,rectd:6};
/* a "starter-level week": the per-game average of the 12th QB/TE or 24th RB/WR this season */
const FP_CUT_N={QB:12,RB:24,WR:24,TE:12},FP_CUT_C={};
function fpCut(pos){
  if(pos in FP_CUT_C)return FP_CUT_C[pos];
  const v=PLAYERS.filter(p=>p.p===pos&&qualifies(p)).map(p=>p.ss.fp).filter(isNum).sort((a,b)=>b-a);
  const x=v[Math.min(v.length,FP_CUT_N[pos])-1];return FP_CUT_C[pos]=isNum(x)?Math.round(x*2)/2:null;
}
const FPP_C={};
/* Projected PPR points: his blended fantasy average, moved by the same defense and
   betting-market adjustments the prop model applies to each scoring stat. */
function fpProj(p,g){
  const ck=p.id+'|'+g.id;if(FPP_C[ck])return FPP_C[ck];
  const pr=project(p,g),games=playerGames(p),cur=games.filter(x=>x.s===SEASON),w=Math.min(cur.length,6)/12;
  const m=a=>a.reduce((s,x)=>s+x,0)/a.length;
  const blend=k=>{const a=games.map(x=>x[k]).filter(isNum),c=cur.map(x=>x[k]).filter(isNum);if(!a.length)return null;return c.length?w*m(c)+(1-w)*m(a):m(a);};
  let cb=0,cp=0;Object.keys(FP_W).forEach(k=>{const b=blend(k);if(!isNum(b))return;const x=pr.keys[k];cb+=FP_W[k]*b;cp+=FP_W[k]*(x?x.proj:b);});
  const base=blend('fp'),f=cb>0?Math.min(1.25,Math.max(0.75,cp/cb)):1;
  const all=games.map(x=>x.fp).filter(isNum),sc=all.map(v=>v*f).sort((a,b)=>a-b),q=x=>sc.length?sc[Math.round(x*(sc.length-1))]:null;
  const cut=fpCut(p.p),hit=isNum(cut)?all.filter(v=>v>=cut).length:null;
  return FPP_C[ck]={proj:isNum(base)?base*f:null,base:base,f:f,lo:q(.25),hi:q(.75),n:all.length,cut:cut,hit:hit,opp:pr.opp};
}
function fpAllowedCell(o,pos,short){
  const v=DA[o]&&DA[o][pos]?DA[o][pos].fp:null;if(!isNum(v))return '—';
  const r=daRank(o,pos,'fp');
  return alink(o,pos,'fp',fx(v,1))+(r?' <span class="small">'+(short?'<span class="'+(r>24?'rk hi':r<=8?'rk lo':'rk')+'">'+ord(r)+'</span>':mup(r))+'</span>':'');
}
function opportunity(p){
  const s=p.ss||{};
  if(p.p==='QB')return fx(s.att,1)+' att, '+fx(s.car,1)+' car';
  if(p.p==='RB')return fx((s.car||0)+(s.rec||0),1)+' touches, '+fx(s.tgt,1)+' tgt';
  return fx(s.tgt,1)+' tgt, '+fmtStat('tshr',s.tshr)+' share';
}
function fantasyWeek(){
  const wks=[...new Set(GAMES.filter(g=>!isFinal(g)).map(g=>g.wk))].sort((a,b)=>a-b);
  if(!FT.wk||wks.indexOf(FT.wk)<0)FT.wk=propWeek();
  return wks;
}
function fantasyRows(pos,wk){
  const ps=pos==='FLEX'?['RB','WR','TE']:[pos];
  return PLAYERS.filter(p=>ps.indexOf(p.p)>=0&&qualifies(p)).map(p=>{
    const g=GAMES.find(x=>x.wk===wk&&!isFinal(x)&&(x.home===p.t||x.away===p.t));if(!g)return null;
    const fp=fpProj(p,g);return isNum(fp.proj)?{p:p,g:g,fp:fp}:null;}).filter(Boolean).sort((a,b)=>b.fp.proj-a.fp.proj);
}

    rows.map((r,i)=>{const p=r.p,f=r.fp;return '<tr><td class="num mut">'+(i+1)+'</td><td>'+plink(p)+' <span class="mut small">'+flag(p.t,'sm')+' '+p.t+(pos==='FLEX'?', '+p.p:'')+'</span></td><td>'+(r.g.home===p.t?'vs ':'at ')+tt(f.opp)+'<div class="mut small">'+shortKick(r.g)+'</div></td>'+

      '<td class="num">'+(isNum(f.hit)?f.hit+' of '+f.n+' <span class="mut small">('+Math.round(f.hit/f.n*100)+'%)</span>':'—')+'</td><td class="small wrap">'+opportunity(p)+(isNum(p.sn)?', '+p.sn+'% snaps':'')+'</td><td class="num">'+fpAllowedCell(f.opp,p.p,true)+'</td></tr>';}).join('')+'</tbody></table></div>';

  return h;

function vProps(){
  const since=HIST[0]||SEASON;
  const rows=WATCH.map((e,i)=>({e,i,p:BY[e.id]})).filter(x=>x.p).map(x=>{
    const k=x.e.stat,all=playerGames(x.p).map(w=>({s:w.s,y:weekVal(w,k)})).filter(q=>isNum(q.y)),cur=all.filter(q=>q.s===SEASON);
    const avg=a=>a.length?a.reduce((s,q)=>s+q.y,0)/a.length:null;
    return Object.assign(x,{all,cur,avgA:avg(all),avgS:avg(cur)});
  }).sort((a,b)=>(Math.abs((b.avgA||0)-b.e.line)+Math.abs((b.avgS||0)-b.e.line))-(Math.abs((a.avgA||0)-a.e.line)+Math.abs((a.avgS||0)-a.e.line)));
  let h='<section class="hero"><div><h1>Props</h1><p class="sub">Enter a sportsbook line and see it against every game he’s played since '+since+', and this season on its own. No live odds feed yet, so lines are typed in. The analysis is all real data. Below: this week\u2019s projections and the matchups moving them.</p></div><div class="row"><a class="btn" href="#/outlook">Outlook</a><a class="btn" href="#/leaders">Stat leaders</a></div></section>';
  h+='<div class="panel" style="margin-top:18px"><div class="row" style="align-items:flex-end">'+
    '<div class="fld" style="flex:2;min-width:220px"><span>Player</span>'+cbx('prop','Start typing a name','','propPick')+'</div>'+
    '<label class="fld" style="flex:1;min-width:160px">Stat<select id="propStat" class="sel" disabled><option>Pick a player first</option></select></label>'+
    '<label class="fld" style="width:120px">Line<input id="propLine" class="inp" type="number" step="0.5" min="0" placeholder="e.g. 4.5"></label>'+
    '<button class="btn solid" id="propAdd">Add to watchlist</button></div><p class="small" id="propMsg" role="status" style="margin-top:8px;color:var(--bad)"></p></div>';
  if(!rows.length)return h+'<p class="empty" style="margin-top:18px">Your watchlist is empty. Add a player, a stat and the line you’re looking at, and it will show here with his hit rate this season and since '+since+', and every game against that line.</p>'+propResearch(8);
  h+='<div class="key" style="margin-top:18px"><span><span class="sw ylk"></span>Yellow line = the prop line</span><span><span class="sw sA"></span>Game over the line</span><span><span class="sw" style="background:var(--miss)"></span>Game under</span><span>Each dot is one game since '+since+'</span></div>';
  h+='<div class="scroll"><table><thead><tr><th>Player</th><th>Stat</th><th class="num">Line</th><th class="num">Avg this season</th><th class="num">Avg since '+since+'</th><th>Every game</th><th class="num">Over this season</th><th class="num">Over since '+since+'</th><th class="num">Next game projection</th><th>Read</th><th><span class="sr">Remove</span></th></tr></thead><tbody>'+
    rows.map(x=>{const p=x.p,k=x.e.stat,line=x.e.line,f=weekFmt(k);
      const oc=x.cur.filter(q=>q.y>line).length,oa=x.all.filter(q=>q.y>line).length;
      const ls=lean(x.avgS,line),la=lean(x.avgA,line);let cls,txt;
      if(ls===la){cls=ls>0?'over':ls<0?'under':'close';txt=ls>0?'Over has value in both samples':ls<0?'Under has value in both samples':'Close to the line';}
      else if(!ls||!la){const d=ls||la;cls=d>0?'over':'under';txt=(d>0?'Leans over':'Leans under')+' ('+(ls?'this season':'since '+since)+')';}
      else{cls='close';txt='Mixed: this season says '+(ls>0?'over':'under')+', since '+since+' says '+(la>0?'over':'under');}
      return '<tr><td>'+plink(p)+'<div class="small mut">'+p.p+', '+esc(nick(p.t))+'</div></td><td>'+esc(ST[k]?ST[k].l:k)+'</td><td class="num">'+line+'</td><td class="num">'+f(x.avgS)+'</td><td class="num">'+f(x.avgA)+'</td>'+
        '<td>'+(x.all.length?strip(x.all.map(q=>q.y),line,f):'—')+'</td><td class="num">'+(x.cur.length?oc+' of '+x.cur.length:'—')+'</td><td class="num">'+(x.all.length?oa+' of '+x.all.length:'—')+'</td><td class="num">'+propProj(p,k)+'</td><td><span class="verdict '+cls+'">'+txt+'</span></td><td><button class="btn" data-rm="'+x.i+'">Remove</button></td></tr>';}).join('')+
    '</tbody></table></div><p class="count">Saved in this browser only.</p>';
  return h+propResearch(8);
}

function notFound(what){return '<section class="hero"><div><h1>Not found</h1><p class="sub">'+what+' isn’t in this season’s data. Try the search box at the top.</p></div></section>';}

/* ======================================================================
   Router
   ====================================================================== */
function render(keep){
  const r=location.hash.replace(/^#\/?/,'').split('/');let v=r[0]||'',html,title='Game Script',nav=v;
  if(v===''||v==='week'||(v==='game'&&!r[1])){html=vWeek();title='Week '+HW;nav='week';}
  else if(v==='game'){html=vGame(r[1]);const g=GAMES.find(x=>x.id===r[1]);title=g?g.away+' at '+g.home:'Game';nav='week';}
  else if(v==='teams'){html=vTeams();title='Teams';}
  else if(v==='team'){html=vTeam(r[1]);title=fullName(r[1]);nav='teams';}
  else if(v==='players'){html=vPlayers();title='Players';}
  else if(v==='player'){const p=BY[r[1]];html=p?vPlayer(p):notFound('That player');title=p?p.n:'Player';nav='players';}
  else if(v==='compare'){
    const KINDS=['teams','players','defense','duel'];let kind=KINDS.indexOf(r[1])>=0?r[1]:'players',a=r[2],b=r[3];
    if(r[1]&&KINDS.indexOf(r[1])<0){a=r[1];b=r[2];}
    html=vCompare(kind,a,b);title='Compare';
  }
  else if(v==='props'){html=vProps();title='Props';}
  else if(v==='outlook'){html=vOutlook();title='Outlook';}
  else if(v==='fantasy'){html=vFantasy();title='Fantasy';}
  else if(v==='leaders'){html=vLeaders(r[1],r[2]);title='Stat leaders';}
  else if(v==='glossary'){html=vGlossary(r[1]);title='Glossary';}
  else if(v==='allowed'){html=vAllowed(r[1],r[2],r[3]);title=(r[1]||'')+' defense vs '+(r[2]||'')+'s';nav='teams';}
  else{html=notFound('That page');}
  const y=window.scrollY;
  app.innerHTML=html;
  layoutSync();
  document.title=title+' | Game Script';
  document.querySelectorAll('.nav a').forEach(a=>{if(a.dataset.nav===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  hideTip();
  if(!keep){const k=location.hash||'#/';window.scrollTo(0,RESTORE&&SCROLL[k]!=null?SCROLL[k]:0);}else window.scrollTo(0,y);
  if(v==='glossary'&&r[1]&&!RESTORE){const el=document.getElementById('g-'+r[1]);if(el){el.scrollIntoView({block:'start'});if(!/^grp-/.test(r[1]))el.classList.add('hl');}}
  SPY_LOCK=null;
  if(v==='glossary'&&r[1]){const el=document.getElementById('g-'+r[1]),sec=el&&el.closest('.glgrp');if(sec)SPY_LOCK={i:+sec.id.replace('g-grp-',''),y:window.scrollY};}
  RESTORE=false;
  layoutSync();
}
/* Sticky offsets, glossary section tracking and the back-to-top button */
function layoutSync(){
  const top=document.querySelector('.top'),root=document.documentElement;
  if(top)root.style.setProperty('--toph',top.offsetHeight+'px');
  const g=document.querySelector('.gltoc'),narrow=g&&getComputedStyle(g).gridTemplateColumns.split(' ').length>1;
  root.style.setProperty('--glh',(g&&narrow?g.offsetHeight:0)+'px');
  onScroll();
}
let SPY_RAF=0,SPY_LOCK=null;
function onScroll(){
  if(SPY_RAF)return;SPY_RAF=requestAnimationFrame(()=>{SPY_RAF=0;
    const gl=/^#\/glossary/.test(location.hash),btn=document.getElementById('totop');
    if(btn)btn.hidden=gl||window.scrollY<window.innerHeight*1.2;
    if(!gl)return;
    const root=getComputedStyle(document.documentElement),off=parseFloat(root.getPropertyValue('--toph'))+parseFloat(root.getPropertyValue('--glh'))+40;
    let cur=0;document.querySelectorAll('.glgrp').forEach((s,i)=>{if(s.getBoundingClientRect().top<=off)cur=i;});
    if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)cur=document.querySelectorAll('.glgrp').length-1;
    /* a section you just jumped to stays highlighted until you scroll (near the bottom it can't reach the top) */
    if(SPY_LOCK){if(Math.abs(window.scrollY-SPY_LOCK.y)<4)cur=SPY_LOCK.i;else SPY_LOCK=null;}
    document.querySelectorAll('.gllinks a').forEach(a=>{const on=+a.dataset.grp===cur;
      if(on&&a.getAttribute('aria-current')!=='true'){a.setAttribute('aria-current','true');const box=a.parentElement;
        if(box.scrollWidth>box.clientWidth)box.scrollTo({left:a.offsetLeft-box.clientWidth/2+a.offsetWidth/2,behavior:'smooth'});}
      else if(!on)a.removeAttribute('aria-current');});
  });
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',layoutSync);

/* Scroll memory: back/forward (and "Back to the page you were on") return you to where you were reading */
const SCROLL={};let NAVCLICK=false,RESTORE=false,GL_ORIGIN=null,BACK_OK=false;
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('a[href^="#"]'))NAVCLICK=true;},true);
window.addEventListener('hashchange',e=>{
  let old='#/';try{old=new URL(e.oldURL).hash||'#/';}catch(x){}
  SCROLL[old]=window.scrollY;
  const toGl=/^#\/glossary/.test(location.hash),fromGl=/^#\/glossary/.test(old);
  if(toGl&&!fromGl){GL_ORIGIN=old;BACK_OK=true;}else if(!toGl){BACK_OK=false;}
  RESTORE=!NAVCLICK;NAVCLICK=false;render(false);
});

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-rm]');if(!t)return;
  if(t.dataset.top!==undefined){const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;window.scrollTo({top:0,behavior:rm?'auto':'smooth'});const a=document.getElementById('app');if(a)a.focus({preventScroll:true});return;}
  if(t.dataset.wk!==undefined){const weeks=[...new Set(GAMES.map(g=>g.wk))].sort((a,b)=>a-b);const d=+t.dataset.wk;
    if(d===0)HW=NEXT_WK;else{const i=weeks.indexOf(HW)+d;if(i>=0&&i<weeks.length)HW=weeks[i];}render(true);return;}
  if(t.dataset.ftpos){FT.pos=t.dataset.ftpos;render(true);return;}
  if(t.dataset.ldmode){LD.mode=t.dataset.ldmode;render(true);return;}
  if(t.dataset.ldpos!==undefined){LD.pos=t.dataset.ldpos;render(true);return;}
  if(t.dataset.pos!==undefined){PL.pos=t.dataset.pos;if(PL.pos&&plCols().indexOf(PL.sort)<0&&['n','g','sn'].indexOf(PL.sort)<0)PL.sort=plCols()[0];if(!PL.pos&&['n','g','sn'].concat(plCols()).indexOf(PL.sort)<0)PL.sort='scy';render(true);return;}
  if(t.dataset.psort){const k=t.dataset.psort;if(PL.sort===k)PL.dir=-PL.dir;else{PL.sort=k;PL.dir=k==='n'?1:(ST[k]&&ST[k].lo?1:-1);}render(true);
    const b=document.querySelector('[data-psort="'+k+'"]');if(b)b.focus();return;}
  if(t.dataset.tsort){const k=t.dataset.tsort;if(TSORT.k===k)TSORT.dir=-TSORT.dir;else{TSORT.k=k;TSORT.dir=1;}render(true);
    const b=document.querySelector('[data-tsort="'+k+'"]');if(b)b.focus();return;}
  if(t.id==='plClear'){PL.pos='';PL.team='';PL.q='';render(true);return;}
  if(t.dataset.ckind){const k=t.dataset.ckind;
    if(k==='teams'){location.hash='#/compare/teams/'+(CMP.ta||'')+'/'+(CMP.tb||'');return;}
    /* the player searched most recently carries into the tab you switch to, once */
    const np=freshPick(k);
    if(k==='defense'){
      let o=DUEL.of,tm=DUEL.team;const src=np||(!o?BY[CMP.pa]:null);
      if(src&&OFF_POS.indexOf(src.p)>=0&&src.id!==o){o=src.id;const g=nextGame(src.t);tm=g?oppOf(g,src.t):'';}
      location.hash='#/compare/defense/'+(o||'')+'/'+(tm||'');return;
    }
    if(k==='duel'){
      let o=DUEL2.o,d=DUEL2.d;const src=np||(!o?(BY[DUEL.of]||BY[CMP.pa]):null);
      if(src&&OFF_POS.indexOf(src.p)>=0&&src.id!==o){o=src.id;d='';}
      location.hash='#/compare/duel/'+(o||'')+'/'+(d||'');return;
    }
    let a=CMP.pa,b=CMP.pb;const src=np||(!a&&DUEL.of?BY[DUEL.of]:null);
    if(src&&src.id!==a){a=src.id;if(!b||b===a||!BY[b]||pk(BY[b])!==pk(BY[a]))b=suggestRival(BY[a])||b;}
    location.hash='#/compare/players/'+(a||'')+'/'+(b||'');return;}
  if(t.dataset.olpos){OL.pos=t.dataset.olpos;OL.sort=null;OL.dir=-1;render(true);const b=document.querySelector('[data-olpos="'+OL.pos+'"]');if(b)b.focus();return;}
  if(t.dataset.olsort){const k=t.dataset.olsort;if(OL.sort===k)OL.dir=-OL.dir;else{OL.sort=k;OL.dir=k==='n'?1:-1;}render(true);const b=document.querySelector('[data-olsort="'+k+'"]');if(b)b.focus();return;}
  if(t.dataset.alspan){AL.span=t.dataset.alspan==='all'?'all':+t.dataset.alspan;render(true);const b=document.querySelector('[data-alspan="'+t.dataset.alspan+'"]');if(b)b.focus();return;}
  if(t.dataset.span){CMP.span=t.dataset.span;render(true);const b=document.querySelector('[data-span="'+CMP.span+'"]');if(b)b.focus();return;}
  if(t.dataset.duel){DUEL.d=t.dataset.duel;render(true);const d=document.getElementById('duel');if(d)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return;}
  if(t.dataset.swap==='players'){picked(CMP.pb,'players');location.hash='#/compare/players/'+CMP.pb+'/'+CMP.pa;return;}
  if(t.dataset.swap==='teams'){location.hash='#/compare/teams/'+CMP.tb+'/'+CMP.ta;return;}
  if(t.id==='glBack'&&GL_ORIGIN){location.hash=GL_ORIGIN;return;}
  if(t.id==='theme'){document.documentElement.setAttribute('data-theme',isDark()?'light':'dark');syncTheme();return;}
  if(t.id==='propAdd'){
    const msg=document.getElementById('propMsg'),stat=document.getElementById('propStat'),line=parseFloat(document.getElementById('propLine').value);
    if(!PROP_PID){msg.textContent='Pick a player from the list first.';return;}
    if(!stat.value||stat.disabled){msg.textContent='Pick a stat.';return;}
    if(isNaN(line)||line<0){msg.textContent='Enter the line, for example 4.5.';return;}
    WATCH.push({id:PROP_PID,stat:stat.value,line:line});saveWatch();PROP_PID=null;render(true);return;
  }
  if(t.dataset.rm!==undefined){WATCH.splice(+t.dataset.rm,1);saveWatch();render(true);return;}
});
document.addEventListener('change',e=>{
  const id=e.target.id,refocus=()=>{const s=document.getElementById(id);if(s)s.focus();};
  if(id==='plTeam'){PL.team=e.target.value;render(true);}
  else if(id==='pvStat'){PV.key=e.target.value;render(true);refocus();}
  else if(id==='pvSpan'){PV.span=e.target.value;render(true);refocus();}
  else if(id==='cStat'){CMP.stat=e.target.value;render(true);refocus();}
  else if(id==='alT'){const r=location.hash.split('/');location.hash='#/allowed/'+e.target.value+'/'+(r[3]||'WR')+'/'+(r[4]||'recyd');}
  else if(id==='olWk'){OL.wk=+e.target.value;render(true);refocus();}
  else if(id==='ftWk'){FT.wk=+e.target.value;render(true);refocus();}
  else if(id==='cdT'){location.hash='#/compare/defense/'+(DUEL.of||'')+'/'+e.target.value;}
  else if(id==='ctA'||id==='ctB'){const a=document.getElementById('ctA').value,b=document.getElementById('ctB').value;location.hash='#/compare/teams/'+a+'/'+b;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='glQ'){const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('.gterm').forEach(a=>{a.hidden=!!q&&a.dataset.q.indexOf(q)<0;});
    document.querySelectorAll('.glgrp').forEach(g=>{g.hidden=![...g.querySelectorAll('.gterm')].some(a=>!a.hidden);});return;}
  if(e.target.id==='plQ'){PL.q=e.target.value;const [body,cnt]=plBody();document.getElementById('plBody').innerHTML=body;document.getElementById('plCount').textContent=cnt;}
  else if(e.target.id==='pvLine'){
    const p=BY[location.hash.split('/')[2]];const v=parseFloat(e.target.value);if(!p||isNaN(v))return;
    PV.line[p.id+'|'+PV.key+'|'+PV.span]=v;document.getElementById('gb').innerHTML=gbHTML(p);
  }
});

/* ---------- Theme ---------- */
const tb=document.getElementById('theme');
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function syncTheme(){const d=isDark();tb.setAttribute('aria-pressed',String(d));tb.textContent=d?'Light':'Dark';tb.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');}
syncTheme();

/* ======================================================================
   Load
   ====================================================================== */
fetch('nfl_data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(D=>{
  PLAYERS=D.players;GAMES=D.games;PAST=D.past_games||[];TS=D.team_stats||{};SCHEME=D.team_scheme||{};DA=D.defense_allowed||{};
  SEASON=D.season;GEN=D.generated;HIST=D.hist_seasons||[];
  Object.keys(D.teams||{}).forEach(t=>{if(D.teams[t]&&D.teams[t].c)TC[t]=D.teams[t].c;if(D.teams[t]&&D.teams[t].logo)TLOGO[t]=D.teams[t].logo;});
  PLAYERS.forEach(p=>{BY[p.id]=p;(BY_TEAM[p.t]=BY_TEAM[p.t]||[]).push(p);derive(p);});
  const fin=GAMES.filter(isFinal);LAST_WK=fin.length?Math.max(...fin.map(g=>g.wk)):0;
  const up=GAMES.filter(g=>!isFinal(g));NEXT_WK=up.length?Math.min(...up.map(g=>g.wk)):LAST_WK;HW=NEXT_WK;
  buildIndex();loadWatch();
  document.getElementById('foot').innerHTML='<p>Data from nflverse: rosters, weekly stats, snap counts, play-by-play, FTN play charting, Next Gen Stats, team colors, and schedules with closing lines. Updated '+esc(genTxt(GEN))+', games through week '+LAST_WK+' of the '+SEASON+' season. History goes back to '+(HIST[0]||SEASON)+'.</p><p>Refreshes automatically after every game window (Thursday, Saturday, Sunday and Monday) and again every Tuesday morning. If this time is more than a few days old during the season, the refresh has stopped running.</p>';
  render(false);
}).catch(err=>{
  app.innerHTML='<div class="err"><b>Couldn’t load nfl_data.json</b> ('+esc(err.message)+').<br>It has to sit in the same folder as this page, and the page has to be served over http, not opened as a file. Locally, run <code>python3 -m http.server</code> in this folder and open localhost:8000.</div>';
  console.error(err);
});
})();
</script>
