<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Script</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* ==========================================================================
   Game Script: data-first design system
   Layout: one 1180px column; page title row, then sections separated by space,
   not boxes. Numbers carry the weight; chrome stays hairline-quiet.
   Signature: the yellow line = the benchmark (league median on percentile
   tracks, your line on game charts). Identity: A = blue, B = orange
   (CVD-checked pair). Percentile circles use a 5-step red-to-green scale.
   ========================================================================== */
:root{
  --bg:#C7C2B6;--surface:#FFFFFF;--sunken:#F0EFEA;--ink:#111915;--ink2:#3F4A45;--mute:#66706B;
  --rule:#E4E2DC;--rule2:#CAC6BD;--turf:#1C6B44;--turf-bg:#DCEDE3;
  --a:#2a78d6;--a-bg:#E4EEFB;--b:#eb6834;--b-bg:#FCEBE3;
  --yl:#F2CC00;--yl-edge:#8C7600;--good:#137A2C;--bad:#C2352E;--miss:#C3D3E4;
  --p0:#C2352E;--p1:#E8A195;--p2:#B4BDB8;--p3:#86C29D;--p4:#1E7D45;--p0i:#fff;--p1i:#3B1410;--p2i:#1E2622;--p3i:#0E2A19;--p4i:#fff;
  --dotline:rgba(0,0,0,.22);--title:#4B3FB0;--logo-fx:none;--edge:#A69F90;--lift:0 1px 0 rgba(0,0,0,.06),0 3px 10px rgba(52,40,16,.13);
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --t-title:34px;--t-h2:19px;--t-h3:15px;--t-body:15px;--t-small:13px;--t-micro:11.5px;--t-fig:24px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050606;--surface:#202725;--sunken:#2B3330;--ink:#E7EEEA;--ink2:#A5B3AC;--mute:#76857E;
    --rule:#2D3431;--rule2:#3D4643;--turf:#4FBF83;--turf-bg:#173526;
    --a:#3987e5;--a-bg:#16294A;--b:#d95926;--b-bg:#3A1F12;
    --yl:#F5D000;--yl-edge:#F5D000;--good:#4CC46E;--bad:#FF7A6E;--miss:#2D4157;
    --p0:#D9534A;--p1:#8C4A42;--p2:#4A5650;--p3:#3E7A55;--p4:#3FB46E;--p0i:#fff;--p1i:#fff;--p2i:#fff;--p3i:#fff;--p4i:#0D1311;
    --dotline:rgba(255,255,255,.28);--title:#B1A9F7;--edge:#46524D;--lift:0 1px 0 rgba(255,255,255,.04) inset,0 4px 14px rgba(0,0,0,.7);--logo-fx:drop-shadow(0 0 .6px rgba(255,255,255,.9)) drop-shadow(0 0 .6px rgba(255,255,255,.6));color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050606;--surface:#202725;--sunken:#2B3330;--ink:#E7EEEA;--ink2:#A5B3AC;--mute:#76857E;
  --rule:#2D3431;--rule2:#3D4643;--turf:#4FBF83;--turf-bg:#173526;
  --a:#3987e5;--a-bg:#16294A;--b:#d95926;--b-bg:#3A1F12;
  --yl:#F5D000;--yl-edge:#F5D000;--good:#4CC46E;--bad:#FF7A6E;--miss:#2D4157;
  --p0:#D9534A;--p1:#8C4A42;--p2:#4A5650;--p3:#3E7A55;--p4:#3FB46E;--p0i:#fff;--p1i:#fff;--p2i:#fff;--p3i:#fff;--p4i:#0D1311;
  --dotline:rgba(255,255,255,.28);--title:#B1A9F7;--edge:#46524D;--lift:0 1px 0 rgba(255,255,255,.04) inset,0 4px 14px rgba(0,0,0,.7);--logo-fx:drop-shadow(0 0 .6px rgba(255,255,255,.9)) drop-shadow(0 0 .6px rgba(255,255,255,.6));color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--toph,56px) + 14px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t-body)/1.5 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
a{color:var(--turf);text-underline-offset:2px;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;line-height:1.15;letter-spacing:-.012em;text-wrap:balance}
h2{font-size:var(--t-h2);margin:40px 0 4px}
h3{font-size:var(--t-h3);margin:0 0 6px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.mut{color:var(--ink2)}
.small{font-size:var(--t-small)}
.lede{color:var(--ink2);font-size:14px;max-width:72ch;margin:2px 0 14px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row>*,.split>*,.duel>*,.pickers>*,.cmp-head>*{min-width:0}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#101A15;color:#E9EFEB;border-bottom:1px solid rgba(255,255,255,.06)}
.top-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:6px 20px;flex-wrap:wrap}
.brand{font:700 19px/1 var(--font);letter-spacing:-.01em;color:#E9EFEB;text-decoration:none;display:flex;align-items:center;gap:9px}
.brand svg{flex:none}
.nav{display:flex;gap:2px;order:3;flex-basis:100%;overflow-x:auto;scrollbar-width:none}
.nav a{padding:6px 11px;color:#E9EFEB;opacity:.68;text-decoration:none;font-weight:600;font-size:14px;border-radius:5px;white-space:nowrap}
.nav a:hover{opacity:1;background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{opacity:1;box-shadow:inset 0 -2px 0 var(--yl)}
.top .cbx{flex:1;min-width:180px;max-width:340px;margin-left:auto}
.top .cbx-in{background:rgba(255,255,255,.08);border-color:transparent;color:#E9EFEB;font-size:14px;padding:7px 11px}
.top .cbx-in::placeholder{color:#E9EFEB;opacity:.55}
.ibtn{border:1px solid rgba(255,255,255,.2);background:none;color:#E9EFEB;padding:6px 11px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
@media (min-width:900px){.nav{order:0;flex-basis:auto}}
@media (min-width:900px) and (max-width:1340px){.nav a{padding:6px 8px;font-size:13.5px}}
@media (max-width:640px){.top .ibtn{margin-left:auto;order:1}.top .cbx{order:2;flex-basis:100%;max-width:none}.nav{order:3}}

main{max-width:1180px;margin:0 auto;padding:4px 16px 64px}
footer{max-width:1180px;margin:0 auto;padding:18px 16px 40px;border-top:1px solid var(--rule);color:var(--ink2);font-size:var(--t-small)}
footer p+p{margin-top:4px}

/* ---------- Search ---------- */
.cbx{position:relative}
.cbx-in{width:100%;padding:8px 11px;border:1px solid var(--rule2);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px}
.cbx-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;list-style:none;margin:0;padding:4px;background:var(--surface);color:var(--ink);border:1px solid var(--rule2);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.16);max-height:360px;overflow:auto;font-size:14px}
.cbx-list li{padding:7px 10px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.cbx-list li span{color:var(--ink2);font-size:13px;white-space:nowrap}
.cbx-list li[aria-selected="true"],.cbx-list li:hover{background:var(--sunken)}
.cbx-list .none{cursor:default;color:var(--ink2)}

/* ---------- Team mark: three overlapping circles in the club's colors ---------- */
.tt{display:inline-flex;align-items:center;gap:7px;font-weight:650;color:inherit;text-decoration:none;white-space:nowrap}
a.tt:hover{text-decoration:underline}
.tf{display:inline-flex;align-items:center;flex:none;vertical-align:-1px}
.tf b{display:block;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1.5px var(--surface),inset 0 0 0 1px var(--dotline)}
.tf b+b{margin-left:-3px}
.tf.sm b{width:8px;height:8px}.tf.sm b+b{margin-left:-2.5px}
.tf.mid b{width:13px;height:13px}.tf.mid b+b{margin-left:-4px}
.tf.lg b{width:18px;height:18px;box-shadow:0 0 0 2px var(--bg),inset 0 0 0 1px var(--dotline)}.tf.lg b+b{margin-left:-6px}
.tf.mid{margin-right:9px;vertical-align:1px}
/* Team logos (nflverse's ESPN logo links); the three color circles show if a logo can't load */
.tf.tl{vertical-align:-3px}
.tf.tl img{display:block;width:18px;height:18px;object-fit:contain;filter:var(--logo-fx)}
.tf.tl b,.tf.tl.nolg img{display:none}
.tf.tl.nolg b{display:block}
.tf.tl.sm img{width:15px;height:15px}
.tf.tl.mid img{width:24px;height:24px}
.tf.tl.lg img{width:40px;height:40px}
.tf.tl.lg{vertical-align:-6px}

/* ---------- Generic ---------- */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px 32px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--rule2);color:var(--ink);background:var(--surface);text-decoration:none;font-weight:600;font-size:13.5px;border-radius:6px;cursor:pointer;white-space:nowrap;line-height:1.35}
.btn:hover{border-color:var(--ink2)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--rule2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
select.sel,input.inp{padding:7px 10px;border:1px solid var(--rule2);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px}
label.fld,div.fld{display:grid;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:600}
.fld .inp,.fld .sel{width:100%}
.note{border-left:2px solid var(--rule2);padding:7px 12px;color:var(--ink2);font-size:13.5px;background:var(--surface);margin-top:20px;border-radius:0 6px 6px 0}
.empty{color:var(--ink2);font-size:14px;padding:10px 0}
.key{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:4px 0 10px;align-items:center}
.key span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:0;margin-right:5px}
.sw.sA{background:var(--a)}.sw.sB{background:var(--b)}
.sw.ylk{width:14px;height:3px;border-radius:1px;background:var(--yl);box-shadow:0 0 0 1px var(--yl-edge)}

/* ---------- Tables ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.scroll.tall{max-height:460px;overflow-y:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.scroll.tall th{position:sticky;top:0;background:var(--surface);z-index:1}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:7px 10px;border-bottom:1px solid var(--rule2);white-space:nowrap;vertical-align:bottom}
td{padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:middle}
th.num,td.num{text-align:right}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--a)}
th[aria-sort]{color:var(--ink)}
th[aria-sort] button::after{content:"";display:inline-block;margin-left:4px;border:4px solid transparent}
th[aria-sort="descending"] button::after{border-top-color:currentColor;vertical-align:-2px}
th[aria-sort="ascending"] button::after{border-bottom-color:currentColor;vertical-align:2px}
tbody tr:hover td{background:var(--sunken)}
td a{font-weight:600;color:var(--ink);text-decoration-color:var(--rule2)}
td a:hover{text-decoration-color:currentColor}
td.wrap{white-space:normal;min-width:200px;max-width:300px}
td.small.wrap{min-width:150px;max-width:240px}
tr.focus td{background:var(--a-bg)}
th.gb,td.gb{border-left:1px solid var(--rule2);padding-left:14px}
tr.tot td{border-top:1px solid var(--ink2);font-weight:600}
tr.bye td{color:var(--mute);font-style:italic}
.count{font-size:13px;color:var(--ink2);margin:10px 0 6px}
.rk{font-size:12px;font-weight:600;color:var(--ink2)}
.rk.hi{color:var(--good)}.rk.lo{color:var(--bad)}
td .pc{display:block;font-size:11px;color:var(--mute);font-weight:600}
td .pc.hi{color:var(--good)}td .pc.lo{color:var(--bad)}
.h2h{font-size:13.5px}.h2h.none{color:var(--mute)}

/* ---------- Page titles ---------- */
.hero,.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding:26px 0 16px;border-bottom:1px solid var(--rule2)}
.hero h1,.ph h1{font-size:var(--t-title);letter-spacing:-.02em}
.ph h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero .sub,.ph .meta{color:var(--ink2);margin-top:6px;font-size:14px;max-width:80ch}
.ph .meta.small{font-size:13px;margin-top:2px}
.ph .acts,.hero .row{display:flex;gap:8px;flex-wrap:wrap}
.ph .bar{display:none}
@media (max-width:640px){:root{--t-title:28px}}

/* ---------- This week ---------- */
.slate{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px;margin-top:18px}
.gt{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 8px;text-decoration:none;color:var(--ink)}
.gt:hover{border-color:var(--rule2);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.gt-team{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 10px;padding:3px 0}
.gt-team .tt{font-size:16px;font-weight:700}
.gt-team .sc{font:700 20px/1 var(--font);font-variant-numeric:tabular-nums}
.gt-team .sc.l{color:var(--mute);font-weight:500}
.gt-team small{grid-column:1/-1;color:var(--ink2);font-size:12px;padding-left:31px}
.gt-foot{margin-top:6px;padding-top:7px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gt-foot b{color:var(--ink);font-weight:600}
.bye{margin-top:12px;font-size:13px;color:var(--ink2)}
.ldr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px 28px}
.ldr ol{list-style:none;margin:0;padding:0;counter-reset:l}
.ldr li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule);counter-increment:l;font-size:14px}
.ldr li::before{content:counter(l);color:var(--mute);font-weight:600;font-size:12px}
.ldr li[data-r]::before{content:attr(data-r)}
.ldr .more{display:block;padding:8px 0 10px;font-size:12px;font-weight:600;border-top:1px solid var(--rule)}
.ldr li a{font-weight:600;color:var(--ink);text-decoration:none}
.ldr li a:hover{text-decoration:underline}
.ldr li .v{font-weight:700;font-variant-numeric:tabular-nums}
.ldr li small{display:block;color:var(--ink2);font-size:12px}
.ldr h3{border-bottom:1px solid var(--rule2);padding-bottom:6px;margin:0;font-size:14px}

/* ---------- Matchup scoreboard ---------- */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;padding:26px 0 16px;border-bottom:1px solid var(--rule2)}
.board .side{display:grid;gap:4px;justify-items:start;text-decoration:none;color:var(--ink)}
.board .side.r{justify-items:end;text-align:right}
.board .tmrow{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;color:var(--ink2)}
.board .side.r .tmrow{flex-direction:row-reverse}
.board .ab{font:700 48px/1 var(--font);letter-spacing:-.02em}
.board .side:hover .ab{text-decoration:underline;text-decoration-thickness:2px}
.board .rec{font-size:13px;color:var(--ink2)}
.board .mid{text-align:center;color:var(--ink2);font-size:13px;padding-bottom:6px}
.board .mid .score{display:block;font:700 34px/1.1 var(--font);color:var(--ink);font-variant-numeric:tabular-nums;margin:2px 0}
.lines{display:flex;gap:8px 32px;flex-wrap:wrap;margin:14px 0 0;padding:0}
.lines div{display:grid}
.lines dt{font-size:12px;color:var(--ink2)}
.lines dd{margin:0;font:700 20px/1.25 var(--font);font-variant-numeric:tabular-nums}
.lines-sm{margin-top:8px}.lines-sm dd{font:500 14px/1.35 var(--font)}
@media (max-width:640px){.board .ab{font-size:34px}.board .mid .score{font-size:26px}}

/* ---------- Stat tiles + percentile sliders ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,172px),1fr));gap:1px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:10px 0 0}
.tile{background:var(--surface);padding:11px 14px 12px;margin:0;box-shadow:1px 0 0 0 var(--rule),0 1px 0 0 var(--rule)}
.tile dt{font-size:12px;color:var(--ink2);font-weight:500;line-height:1.3}
.tile dd{margin:3px 0 0;font:650 var(--t-fig)/1.1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .pt{font-size:11.5px;color:var(--ink2);margin-top:6px}
.pct{margin:12px 2px 0 0}
.pct .trk{position:relative;display:block;height:4px;background:var(--sunken);border-radius:2px}
.pct .trk b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;opacity:.55}
.pct .dotp{position:absolute;top:50%;transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 4px;border-radius:11px;display:grid;place-items:center;font:700 11px/1 var(--font);font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--surface)}
.p0{background:var(--p0);color:var(--p0i)}.p1{background:var(--p1);color:var(--p1i)}.p2{background:var(--p2);color:var(--p2i)}.p3{background:var(--p3);color:var(--p3i)}.p4{background:var(--p4);color:var(--p4i)}
.pcd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:10px;font:700 10.5px/1 var(--font);margin-left:6px;vertical-align:1px}
.med{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--yl);box-shadow:0 0 0 .5px var(--yl-edge)}
.pbar{position:relative;height:4px;background:var(--sunken);border-radius:2px;margin-top:10px}
.pbar b{position:absolute;left:0;top:0;bottom:0;background:var(--a);border-radius:2px}

/* ---------- Comparison rows ---------- */
.cmp-head{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:18px 0 4px}
.cmp-card{border-radius:8px;padding:12px 14px;border:1px solid var(--rule);background:var(--surface);position:relative;overflow:hidden;display:grid;align-content:start;gap:3px}
.cmp-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.cmp-card.A::before{background:var(--a)}.cmp-card.B::before{background:var(--b)}
.cmp-card.B{text-align:right}.cmp-card.B::before{left:auto;right:0}
.cmp-card h3{font-size:22px;margin:0;letter-spacing:-.015em;overflow-wrap:anywhere}
.cmp-card h3 a{color:var(--ink);text-decoration:none}
.cmp-card h3 a:hover{text-decoration:underline}
.cmp-card p{color:var(--ink2);font-size:13px}
.cmp-card .score{font-size:13px;margin-top:4px;color:var(--ink)}
.vs{font:600 13px var(--font);color:var(--mute);align-self:center}
.pickers{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.pickers .swap{margin-bottom:1px}
.tugs{margin-top:6px}
.tug-g{font-size:12px;color:var(--ink2);font-weight:700;padding:16px 0 5px;border-bottom:1px solid var(--rule2);display:flex;justify-content:space-between}
.tug{display:grid;grid-template-columns:92px 1fr minmax(120px,190px) 1fr 92px;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.tug .tl{text-align:center;font-size:13px;font-weight:600;line-height:1.25}
.tug .tl small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.tug .tv{font-variant-numeric:tabular-nums;color:var(--ink2);line-height:1.15}
.tug .tv.A{text-align:right}
.tug .tv b{display:block;font:600 17px/1.15 var(--font);color:var(--ink2)}
.tug .tv.win b{color:var(--ink);font-weight:750}
.tug .tv small{font-size:11.5px}
.tb{position:relative;height:8px;background:var(--sunken);border-radius:4px}
.tb b{position:absolute;top:0;bottom:0;border-radius:4px;animation:grow .45s cubic-bezier(.2,.7,.2,1) both}
.tb.A b{right:0;background:var(--a);transform-origin:right}
.tb.B b{left:0;background:var(--b);transform-origin:left}
.tb .med{top:-3px;bottom:-3px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.tb b{animation:none}}
@media (max-width:640px){
  .tug{grid-template-columns:62px 1fr 1fr 62px;grid-template-areas:"l l l l" "va ba bb vb";row-gap:5px}
  .tug .tl{grid-area:l}.tug .tv.A{grid-area:va}.tug .tb.A{grid-area:ba}.tug .tb.B{grid-area:bb}.tug .tv.B{grid-area:vb}
  .cmp-head,.pickers{grid-template-columns:1fr}
  .cmp-head .vs,.pickers .swap{justify-self:center}
  .cmp-card.B{text-align:left}.cmp-card.B::before{left:0;right:auto}
}

/* ---------- Charts ---------- */
.chartwrap{position:relative;margin-top:6px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--mute);font:500 11.5px var(--font);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .axis{stroke:var(--rule2);stroke-width:1}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.sA{stroke:var(--a)}.chart .ln.sB{stroke:var(--b)}
.chart .dot{stroke:var(--surface);stroke-width:2}
.chart .dot.sA{fill:var(--a)}.chart .dot.sB{fill:var(--b)}
.chart .dot.clip{fill:var(--surface);stroke-width:2}
.chart .dot.clip.sA{stroke:var(--a)}.chart .dot.clip.sB{stroke:var(--b)}
.chart .endlab{font-weight:700;font-size:12px}
.chart .endlab.sA{fill:var(--a)}.chart .endlab.sB{fill:var(--b)}
.chart .yl-e{stroke:var(--yl-edge);stroke-width:4}
.chart .yl{stroke:var(--yl);stroke-width:2.5}
.chart .yltag{fill:var(--ink);font-weight:700}
.chart .xh{stroke:var(--ink2);stroke-width:1;opacity:0;pointer-events:none}
.chart .bar.hit{fill:var(--a)}.chart .bar.miss{fill:var(--miss)}
.chart .bar.win{fill:var(--good)}.chart .bar.loss{fill:var(--bad)}
.chart .cut{fill:var(--surface)}
.chart .blab{fill:var(--ink2);font-weight:600;font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart .blab.hi{fill:var(--ink);font-weight:700}
.chart .opp{fill:var(--mute);font-size:10.5px}
.chart .ofl{fill:var(--sunken)}
.chart-note{font-size:12px;color:var(--mute);margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:2px}
details.tview{margin-top:6px;font-size:13.5px}
details.tview summary{cursor:pointer;color:var(--ink2);font-weight:600;font-size:13px}
details.tview table{margin-top:8px;font-size:13.5px}
.dtab{margin-top:8px}
.dtab table{font-size:13px}
.dtab td,.dtab th{padding:5px 8px}
.dtab td.best{font-weight:700;color:var(--ink)}
#tip{position:fixed;z-index:50;pointer-events:none;background:#101A15;color:#E9EFEB;padding:7px 10px;border-radius:6px;font-size:12.5px;line-height:1.45;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#tip .sw{width:8px;height:8px}
#tip .mut{color:#E9EFEB;opacity:.7}
.strip{display:block;width:180px;height:30px}
.strip .d{stroke:var(--surface);stroke-width:1.5}
.strip .d.o{fill:var(--a)}.strip .d.u{fill:var(--miss)}
.strip .rail{stroke:var(--rule2)}
@media (max-width:640px){.chartwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.chartwrap .chart{min-width:700px}.chart text{font-size:16px}.chart .endlab{font-size:16px}.chart .opp,.chart .blab{font-size:15px}}

/* ---------- Lists ---------- */
.kp{list-style:none;margin:0;padding:0}
.kp li{display:grid;grid-template-columns:40px 1fr auto;gap:2px 10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.kp .pos{font-weight:700;color:var(--mute);font-size:12px}
.kp a{font-weight:650;color:var(--ink);text-decoration:none}
.kp a:hover{text-decoration:underline}
.kp .ln2{grid-column:2/-1;font-size:13px;color:var(--ink2);line-height:1.45}
.kp .ln2 a{font-weight:600;color:var(--turf)}
.kp .fp{font-weight:700;font-variant-numeric:tabular-nums}
.verdict{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.verdict.over{background:var(--turf-bg);color:var(--good)}
.verdict.under{background:var(--b-bg);color:var(--bad)}
.verdict.close{background:var(--sunken);color:var(--ink2)}
.dgrp{margin-top:20px}
.duel{display:grid;grid-template-columns:1fr minmax(170px,220px) 1fr;gap:16px;align-items:start;margin-top:12px}
.duel .mid{text-align:center;padding:14px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);align-self:center}
.duel .mid .big{font:700 44px/1 var(--font);margin:6px 0;font-variant-numeric:tabular-nums}
.duel h3{margin-bottom:0}
@media (max-width:820px){.duel{grid-template-columns:1fr}}
.duel.solo{grid-template-columns:minmax(0,340px)}
.duel.solo .mid{text-align:left;align-self:start}
.tile dt,.tile dt a{font-size:12.5px;font-weight:700;color:var(--title)}
.tug .tl,.tug .tl a{font-weight:700;color:var(--title)}
.lines dt,.lines dt a{font-weight:700;color:var(--title)}
.gl{color:var(--title);font-weight:700;text-decoration:none;border-bottom:1px dotted transparent}
.gl:hover{border-bottom-color:currentColor}
.key a{color:var(--title);font-weight:600}
/* Glossary */
.glwrap{display:grid;grid-template-columns:220px 1fr;gap:36px;margin-top:20px}
.gltoc{position:sticky;top:calc(var(--toph,56px) + 14px);align-self:start;display:grid;gap:8px;max-height:calc(100vh - var(--toph,56px) - 28px);overflow-y:auto}
.gltoc .inp{width:100%}
.gllinks{display:grid;gap:1px}
.gltoc a{color:var(--ink2);text-decoration:none;font-size:13.5px;padding:4px 8px;border-radius:5px;white-space:nowrap}
.gltoc a:hover{background:var(--sunken);color:var(--ink)}
.gltoc a[aria-current="true"]{background:var(--surface);color:var(--title);font-weight:700;box-shadow:inset 2px 0 0 var(--title)}
.gltop{justify-self:start;border:1px solid var(--rule2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.gltop{order:1}
.gltop:hover{color:var(--ink);border-color:var(--ink2)}
.glgrp{scroll-margin-top:var(--glh,0px)}
.glgrp h2{margin:30px 0 2px}
.glgrp:first-child h2{margin-top:0}
.gterm{padding:12px 0 14px;border-bottom:1px solid var(--rule);max-width:72ch;scroll-margin-top:var(--glh,0px)}
.gterm h3{color:var(--title);font-size:16px}
.gterm p{font-size:14.5px;margin-top:4px}
.gterm .gsrc{color:var(--mute);font-size:12.5px}
.gterm.hl{animation:hl 2.6s ease-out}
@keyframes hl{0%,30%{background:var(--a-bg);box-shadow:0 0 0 10px var(--a-bg)}100%{background:transparent;box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){.gterm.hl{animation:none;background:var(--a-bg)}}
@media (max-width:820px){.glwrap{grid-template-columns:1fr;gap:16px}
  .gltoc{top:var(--toph,56px);z-index:6;max-height:none;overflow:visible;grid-template-columns:1fr auto;gap:8px;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--rule2);box-shadow:0 8px 12px -10px rgba(0,0,0,.25)}
  .gllinks{grid-column:1/-1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}

  .gltoc a{border:1px solid var(--rule2);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}
  .gltoc a[aria-current="true"]{box-shadow:none;background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .gltop{align-self:center;order:0}}
/* Back to top, every long page */
.totop{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:15;border:1px solid var(--rule2);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.totop:hover{border-color:var(--ink2)}
/* ---------- Design rule: data sits in raised boxes on a matte page ----------
   Every table, chart, comparison block and list lives in its own box (surface)
   set apart from the page background, so the data pops and is easy to engage with. */
.scroll,.tugs,.viz,.ldr>div,.kp,.lines,.gterm{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.015)}
.scroll table th:first-child,.scroll table td:first-child{padding-left:14px}
.scroll table th:last-child,.scroll table td:last-child{padding-right:14px}
.scroll tbody tr:last-child td{border-bottom:0}
.tugs{padding:2px 16px 4px}
.tugs .tug:last-child{border-bottom:0}
.viz{padding:12px 14px 10px;margin-top:8px}
.viz .scroll{border:0;box-shadow:none;border-radius:0;background:none}
.viz .scroll table th:first-child,.viz .scroll table td:first-child{padding-left:8px}
.ldr>div{padding:12px 14px 4px}
.ldr li:last-child{border-bottom:0}
.kp{padding:2px 14px}
.kp li:last-child{border-bottom:0}
.lines{padding:12px 16px}
/* stronger separation between data boxes and the page */
.scroll,.tugs,.viz,.ldr>div,.kp,.lines,.gterm,.panel,.gt,.tiles{border-color:var(--edge);box-shadow:var(--lift)}
.note{border-left-color:var(--edge);box-shadow:var(--lift)}
/* section bands: what the next block is for */
.band{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:44px 0 0;padding:11px 16px;border-radius:10px;background:var(--ink);color:var(--bg);border-left:6px solid var(--yl)}
.band .bt{font-weight:800;font-size:15px;letter-spacing:.02em;text-transform:uppercase}
.band .bs{font-size:13.5px;opacity:.85}
.band a{color:inherit;font-weight:700}
.band.pro{border-left-color:#5B8DEF}.band.fan{border-left-color:#F08A4B}.band.ctx{border-left-color:var(--yl)}
.band+h2{margin-top:18px}
.tiles{border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.gterm{padding:12px 16px;margin-top:8px}
.split>div>h3,.dgrp>h3{margin-top:4px}
/* numbers that open the games behind them */
.dl{color:inherit;text-decoration:underline dotted;text-decoration-color:var(--mute);text-underline-offset:3px}
.dl:hover{color:var(--title);text-decoration-color:currentColor}
.navrow{display:grid;gap:8px;margin-top:14px}
.chips a{border:1px solid var(--rule2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none}
.chips a:hover{border-color:var(--ink2)}
.chips a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pl{display:inline-block;margin:1px 14px 1px 0;white-space:nowrap}
.err{background:var(--b-bg);border-left:3px solid var(--bad);padding:12px 14px;margin-top:24px;border-radius:0 6px 6px 0}
</style>

/* Advanced (FTN charting + Next Gen Stats). b: 1 higher is better, -1 lower is better, 0 style (no "better") */
const ADV={
  cpoe:{l:'Completion % over expected',u:'%',d:1,b:1},int_worthy_pct:{l:'Turnover-worthy throws',u:'%',d:1,b:-1},
  fault_sack_pct:{l:'Sacks he caused',u:'%',d:1,b:-1},throwaway_pct:{l:'Throwaway rate',u:'%',d:1,b:0},

/* Per-game bars with an adjustable yellow line. pts: [{s, w, opp, y}] across one or more seasons */
function gameBars(pts,o){
  if(!pts.length)return '<p class="empty">No games logged.</p>';
  const n=pts.length,dense=n>20,multi=new Set(pts.map(p=>p.s)).size>1;
  const cs=capScale(pts.map(p=>p.y),isNum(o.line)?o.line:0),OV=cs.over?30:0;
  const W=980,L=40,R=58,T=14+OV,B=dense?30:42,H=(o.h||236)+OV;
  const lo=Math.min(0,...pts.map(p=>p.y)),tk=niceTicks(lo,cs.cap,4),mn=tk[0],mx=tk[tk.length-1];
  const Y=v=>T+(H-T-B)*(1-(Math.min(v,mx)-mn)/(mx-mn)),slot=(W-L-R)/n,bw=Math.min(34,slot*(dense?.7:.58)),y0=Y(0);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Game by game')+'">';
  if(cs.over)s+='<rect class="ofl" x="'+L+'" y="2" width="'+(W-L-R)+'" height="'+(T-6)+'" rx="3"/><text x="'+(W-R+6)+'" y="'+(T-10)+'">'+tickTxt(mx,tk)+'+</text>';
  tk.forEach(v=>{s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+tickTxt(v,tk)+'</text>';});
  const maxI=pts.reduce((bi,p,i)=>p.y>pts[bi].y?i:bi,0);let lab='';
  pts.forEach((p,i)=>{
    const cx=L+slot*i+slot/2,over=p.y>mx,yv=over?14:Y(p.y),top=Math.min(yv,y0),h=Math.max(Math.abs(y0-yv),p.y?2:1),newS=i>0&&pts[i-1].s!==p.s,x=cx-bw/2;
    if(newS)s+='<line class="axis" x1="'+(L+slot*i).toFixed(1)+'" x2="'+(L+slot*i).toFixed(1)+'" y1="'+T+'" y2="'+(H-B+24)+'"/>';
    const cls=isNum(o.line)?(p.y>o.line?'hit':'miss'):'hit';
    s+='<rect class="bar '+cls+'" x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" data-tip="'+esc((multi?p.s+', ':'')+'Week '+p.w+' vs '+p.opp+': '+o.fmt(p.y)+(isNum(o.line)?(p.y>o.line?' (over)':p.y===o.line?' (push)':' (under)'):''))+'"/>';
    if(over)s+=cutMark(x,bw,T-3);
    if(!dense||over||i===maxI)lab+='<text class="blab'+(over||i===maxI?' hi':'')+'" x="'+cx+'" y="'+(p.y<0?yv+13:top-5)+'" text-anchor="middle">'+o.fmt(p.y)+'</text>';
    if(!dense)s+='<text x="'+cx+'" y="'+(H-24)+'" text-anchor="middle">W'+p.w+'</text><text class="opp" x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+esc(p.opp)+'</text>';
    else if(i===0||newS)s+='<text x="'+(L+slot*i+3)+'" y="'+(H-12)+'" text-anchor="start" style="font-weight:700">'+p.s+'</text>';
  });
  s+='<line class="axis" x1="'+L+'" x2="'+(W-R)+'" y1="'+y0+'" y2="'+y0+'"/>';
  if(isNum(o.line))s+=ylLine(L,W-R,Y(o.line),o.fmt(o.line));
  s+=lab;
  return '<div class="viz"><div class="chartwrap">'+s+'</svg></div>'+(cs.over?OVER_NOTE:'')+'</div>';
}

/* Weekly lines. series: [{name, short, c:'A'|'B', pts:[{x:week,y,note}]}].
   A compact data table sits under the chart so every value is readable at a glance. */
function lineChart(series,o){
  o=o||{};const id='ch'+(++SEQ);
  const xs=[...new Set(series.flatMap(s=>s.pts.map(p=>p.x)))].sort((a,b)=>a-b);
  if(!xs.length)return '<p class="empty">No games logged yet.</p>';
  const ys=series.flatMap(s=>s.pts.map(p=>p.y)).filter(isNum);
  const cs=capScale(ys,isNum(o.line)?o.line:0),OV=cs.over?26:0;
  const W=980,H=(o.h||250)+OV,L=40,R=series.length>1?100:22,T=14+OV,B=28;
  const tk=niceTicks(Math.min(0,...ys),cs.cap,4),mn=tk[0],mx=tk[tk.length-1];
  const X=v=>{const i=xs.indexOf(v);return xs.length===1?(L+W-R)/2:L+(W-L-R)*i/(xs.length-1);};
  const Y=v=>v>mx?OV/2+4:T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Chart')+'">';
  if(cs.over)s+='<rect class="ofl" x="'+L+'" y="2" width="'+(W-L-R)+'" height="'+(T-6)+'" rx="3"/>';
  tk.forEach(v=>{s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+tickTxt(v,tk)+'</text>';});
  s+='<line class="axis" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(Math.max(mn,0))+'" y2="'+Y(Math.max(mn,0))+'"/>';
  xs.forEach(v=>{s+='<text x="'+X(v)+'" y="'+(H-8)+'" text-anchor="middle">W'+v+'</text>';});
  if(isNum(o.line))s+=ylLine(L,W-R,Y(o.line),o.lineTag);
  const ends=[];
  series.forEach(se=>{
    const pts=se.pts.filter(p=>isNum(p.y)).sort((a,b)=>a.x-b.x);if(!pts.length)return;
    s+='<path class="ln s'+se.c+'" d="'+pts.map((p,i)=>((i&&xs.indexOf(p.x)===xs.indexOf(pts[i-1].x)+1)?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('')+'"/>';
    pts.forEach(p=>{const over=p.y>mx;s+='<circle class="dot s'+se.c+(over?' clip':'')+'" cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(over?5:4)+'"/>';
      if(over)s+='<text class="blab hi" x="'+(X(p.x)+9)+'" y="'+(Y(p.y)+4)+'">'+(o.fmt||(v=>fx(v,1)))(p.y)+'</text>';});
    const lp=pts[pts.length-1];ends.push({c:se.c,t:se.short||se.name,x:X(lp.x)+10,y:Y(lp.y)+4});
  });
  if(series.length>1){
    if(ends.length===2&&Math.abs(ends[0].y-ends[1].y)<15){const up=ends[0].y<=ends[1].y?0:1;ends[up].y-=8;ends[1-up].y+=8;}
    ends.forEach(e=>{s+='<text class="endlab s'+e.c+'" x="'+e.x+'" y="'+e.y+'">'+esc(e.t)+'</text>';});
  }
  s+='<line class="xh" x1="-9" x2="-9" y1="'+T+'" y2="'+(H-B)+'"/>';
  s+='<rect class="hov" data-chart="'+id+'" x="'+(L-12)+'" y="0" width="'+(W-L-R+24)+'" height="'+H+'" fill="transparent"/></svg>';
  const fmt=o.fmt||(v=>fx(v,1));
  CH[id]={xs:xs,X:xs.map(X),W:W,series:series,fmt:fmt};
  let leg='';
  if(series.length>1)leg='<div class="legend">'+series.map(se=>'<span><span class="sw s'+se.c+'"></span>'+esc(se.name)+'</span>').join('')+(isNum(o.line)?'<span><span class="sw ylk"></span>'+esc(o.lineKey||'Benchmark')+'</span>':'')+'</div>';
  /* data table: series as rows, weeks as columns; the higher value each week is bold */
  const val=(se,x)=>{const p=se.pts.find(q=>q.x===x);return p&&isNum(p.y)?p.y:null;};
  const tbl='<div class="scroll dtab"><table><thead><tr><th></th>'+xs.map(x=>'<th class="num">W'+x+'</th>').join('')+'</tr></thead><tbody>'+
    series.map(se=>'<tr><td><span class="sw s'+se.c+'"></span>'+esc(se.short||se.name)+'</td>'+xs.map(x=>{const v=val(se,x),best=series.length>1&&isNum(v)&&series.every(t=>t===se||!isNum(val(t,x))||val(t,x)<v);
      return '<td class="num'+(best?' best':'')+'">'+(isNum(v)?fmt(v):'<span class="mut">–</span>')+'</td>';}).join('')+'</tr>').join('')+'</tbody></table></div>';
  return '<div class="viz"><div class="chartwrap">'+leg+s+'</div>'+(cs.over?OVER_NOTE.replace('Bars','Points').replace('each one','each point'):'')+tbl+'</div>';
}

/* Team week-by-week point margin, win/loss bars, blowouts cut to fit */
function marginChart(log){
  if(!log.length)return '<p class="empty">No games played yet.</p>';
  const ms=log.map(g=>g.pf-g.pa),cs=capScale(ms,7),OV=cs.over?26:0;
  const W=980,H=236+OV*2,L=40,R=16,T=16+OV,B=42+OV,n=log.length;
  const tk=niceTicks(-cs.cap,cs.cap,4),mn=tk[0],top=tk[tk.length-1],lim=Math.min(-mn,top);
  const Y=v=>T+(H-T-B)*(1-(Math.max(-lim,Math.min(lim,v))-mn)/(top-mn)),slot=(W-L-R)/n,bw=Math.min(34,slot*.58),y0=Y(0);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Point margin by game">';
  tk.forEach(v=>{s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+(v>0?'+':'')+tickTxt(v,tk)+'</text>';});
  log.forEach((g,i)=>{
    const m=g.pf-g.pa,cx=L+slot*i+slot/2,x=cx-bw/2,over=Math.abs(m)>lim,res=m>0?'W':m<0?'L':'T';
    const y=over?(m>0?T-OV+8:H-B+OV-8):Y(m);
    s+='<rect class="bar '+(m>=0?'win':'loss')+'" x="'+x.toFixed(1)+'" y="'+Math.min(y,y0).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(Math.abs(y0-y),1.5).toFixed(1)+'" rx="2" data-tip="'+esc('Week '+g.wk+(g.home?' vs ':' at ')+g.opp+': '+res+' '+g.pf+'–'+g.pa+'\nYards '+g.yds+', allowed '+g.ydsa)+'"/>';
    if(over)s+=cutMark(x,bw,m>0?T-3:H-B+1);
    s+='<text class="blab'+(over?' hi':'')+'" x="'+cx+'" y="'+(m>=0?y-5:y+14)+'" text-anchor="middle">'+(m>0?'+':m<0?'−':'')+Math.abs(m)+'</text>';
    s+='<text x="'+cx+'" y="'+(H-22)+'" text-anchor="middle">W'+g.wk+'</text><text class="opp" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+(g.home?'':'@')+esc(g.opp)+'</text>';
  });
  s+='<line class="axis" x1="'+L+'" x2="'+(W-R)+'" y1="'+y0+'" y2="'+y0+'"/></svg>';
  return '<div class="viz"><div class="chartwrap">'+s+'</div>'+(cs.over?OVER_NOTE:'')+'</div>';
}
/* Dot strip for props: each game a dot, yellow line = the prop line */
function strip(vals,line,fmt){
  const W=180,H=30,pad=8,mx=Math.max(line*1.6,...vals,1);
  const X=v=>pad+(W-2*pad)*Math.min(v,mx)/mx;
  let s='<svg class="strip" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Each game against the line"><line class="rail" x1="'+pad+'" x2="'+(W-pad)+'" y1="15" y2="15"/>';
  s+='<line class="yl-e" x1="'+X(line)+'" x2="'+X(line)+'" y1="3" y2="27" style="stroke:var(--yl-edge);stroke-width:5"/><line x1="'+X(line)+'" x2="'+X(line)+'" y1="3" y2="27" style="stroke:var(--yl);stroke-width:3"/>';
  vals.forEach((v,i)=>{s+='<circle class="d '+(v>line?'o':'u')+'" cx="'+X(v).toFixed(1)+'" cy="'+(15+((i%3)-1)*5)+'" r="5" data-tip="'+esc(fmt(v))+'"/>';});
  return s+'</svg>';
}

/* ======================================================================
   Comparison rows ("tug of war"): A grows left, B grows right,
   bar length = percentile (players) or rank (teams); yellow tick = league median
   ====================================================================== */
function tug(label,sub,a,b){
  /* a/b: {v:display string, raw:number, g:goodness 0-100|null, note:string} ; better: 1,-1,0 */
  const better=a.better;let wa='',wb='';
  if(better&&isNum(a.raw)&&isNum(b.raw)&&a.raw!==b.raw){
    const aWins=better===1?a.raw>b.raw:a.raw<b.raw;if(aWins)wa=' win';else wb=' win';
  }
  const bar=(side,o)=>'<div class="tb '+side+'" aria-hidden="true">'+(isNum(o.g)?'<b style="width:'+Math.max(o.g,2)+'%"></b>':'')+'<i class="med"></i></div>';
  return '<div class="tug" role="row"><div class="tv A'+wa+'" role="cell"><b>'+a.v+'</b><small>'+(a.note||'')+'</small></div>'+bar('A',a)+
    '<div class="tl" role="rowheader">'+glab(label,null,lblId(label))+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'+bar('B',b)+
    '<div class="tv B'+wb+'" role="cell"><b>'+b.v+'</b><small>'+(b.note||'')+'</small></div></div>';
}
function tugKey(note){
  return '<div class="key"><span><a href="#/glossary/median">How to read these bars</a></span><span><span class="sw ylk"></span>Yellow line = league median</span><span>'+esc(note)+'</span><span><svg width="8" height="8" aria-hidden="true"><circle cx="4" cy="4" r="3.5" fill="currentColor"/></svg> marks the better number</span></div>';
}
function teamTugs(A,B,keys,groups){
  let h='',last='';
  keys.forEach(k=>{
    const m=TMK[k];if(!m)return;
    if(groups&&m.g!==last){h+='<div class="tug-g"><span>'+m.g+'</span></div>';last=m.g;}
    const side=t=>{const v=tmVal(m,t),r=tmRank(m,t);return {v:fmtTM(m,v),raw:v,g:m.b===0?(r?Math.round((32-r)/31*100):null):tmGood(m,t),note:r?'<span class="'+(m.b?rkCls(r):'rk')+'">'+rankTxt(m,r)+'</span>':'',better:m.b};};
    h+=tug(m.l,m.b===0?'Style, not better or worse':'',side(A),side(B));
  });
  return '<div class="tugs" role="table">'+h+'</div>';
}

/* ======================================================================
   Search / combobox (global search + player and prop pickers)
   ====================================================================== */
let IDX=[];
function buildIndex(){
  IDX=TL.map(t=>({type:'team',id:t,label:fullName(t),sub:'Team',key:(t+' '+fullName(t)).toLowerCase()}));
  PLAYERS.slice().sort((a,b)=>(b.g>0)-(a.g>0)||((b.ss&&b.ss.fp)||0)-((a.ss&&a.ss.fp)||0)).forEach(p=>{
    IDX.push({type:'player',id:p.id,label:p.n,sub:posLabel(p)+', '+nick(p.t),key:(p.n+' '+p.p+' '+posLabel(p)+' '+p.t+' '+nick(p.t)).toLowerCase()});
  });
}
function cbx(kind,placeholder,value,id){
  return '<div class="cbx" data-kind="'+kind+'"><label class="sr" for="'+id+'">'+esc(placeholder)+'</label><input id="'+id+'" class="cbx-in" type="search" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="'+id+'-list" autocomplete="off" spellcheck="false" placeholder="'+esc(placeholder)+'" value="'+esc(value||'')+'"><ul class="cbx-list" id="'+id+'-list" role="listbox" hidden></ul></div>';
}
function cbxMatches(kind,q){
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  const src=kind==='global'?IDX:IDX.filter(x=>x.type==='player'&&(kind!=='prop'||PROP_KEYS[BY[x.id].p])&&((kind!=='pO'&&kind!=='dO')||OFF_POS.indexOf(BY[x.id].p)>=0)&&(kind!=='dD'||isDef(BY[x.id])));
  if(!toks.length)return [];
  const out=[];for(const it of src){if(toks.every(t=>it.key.indexOf(t)>=0)){out.push(it);if(out.length>=8)break;}}
  return out;
}
function cbxOpen(input){
  const box=input.closest('.cbx'),list=box.querySelector('.cbx-list'),kind=box.dataset.kind;
  const items=cbxMatches(kind,input.value);box._items=items;box._act=items.length?0:-1;
  if(!input.value.trim()){list.hidden=true;input.setAttribute('aria-expanded','false');return;}
  list.innerHTML=items.length?items.map((it,i)=>'<li role="option" id="'+input.id+'-o'+i+'" data-i="'+i+'" aria-selected="'+(i===0)+'">'+esc(it.label)+'<span>'+esc(it.sub)+'</span></li>').join(''):'<li class="none" role="option" aria-disabled="true">No player or team matches “'+esc(input.value)+'”</li>';
  list.hidden=false;input.setAttribute('aria-expanded','true');
  if(items.length)input.setAttribute('aria-activedescendant',input.id+'-o0');else input.removeAttribute('aria-activedescendant');
}
function cbxClose(box){const l=box.querySelector('.cbx-list'),i=box.querySelector('.cbx-in');l.hidden=true;i.setAttribute('aria-expanded','false');i.removeAttribute('aria-activedescendant');}
function cbxMove(box,d){
  const items=box._items||[];if(!items.length)return;
  box._act=(box._act+d+items.length)%items.length;
  const inp=box.querySelector('.cbx-in');
  box.querySelectorAll('li[data-i]').forEach(li=>li.setAttribute('aria-selected',String(+li.dataset.i===box._act)));
  inp.setAttribute('aria-activedescendant',inp.id+'-o'+box._act);
  const el=box.querySelector('li[data-i="'+box._act+'"]');if(el)el.scrollIntoView({block:'nearest'});
}
function cbxChoose(box,i){
  const it=(box._items||[])[i];if(!it)return;const kind=box.dataset.kind,inp=box.querySelector('.cbx-in');
  cbxClose(box);
  if(kind==='global'){inp.value='';inp.blur();location.hash=it.type==='team'?'#/team/'+it.id:'#/player/'+it.id;return;}
  if(kind==='pA'){picked(it.id,'players');CMP.pa=it.id;location.hash='#/compare/players/'+CMP.pa+'/'+CMP.pb;return;}
  if(kind==='pB'){CMP.pb=it.id;location.hash='#/compare/players/'+CMP.pa+'/'+CMP.pb;return;}
  if(kind==='dO'){picked(it.id,'duel');location.hash='#/compare/duel/'+it.id+'/';return;}
  if(kind==='dD'){location.hash='#/compare/duel/'+(DUEL2.o||'')+'/'+it.id;return;}
  if(kind==='pO'){picked(it.id,'defense');const g=nextGame(BY[it.id].t);location.hash='#/compare/defense/'+it.id+'/'+(g?oppOf(g,BY[it.id].t):'');return;}
  if(kind==='prop'){PROP_PID=it.id;inp.value=it.label+' ('+it.sub+')';const sel=document.getElementById('propStat');if(sel){sel.disabled=false;sel.innerHTML=(PROP_KEYS[BY[it.id].p]||[]).map(k=>'<option value="'+k+'">'+esc(ST[k].l)+'</option>').join('');}
    const ln=document.getElementById('propLine');if(ln)ln.focus();return;}
}
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('cbx-in'))cbxOpen(e.target);});
document.addEventListener('keydown',e=>{
  const inp=e.target;
  if(inp.classList&&inp.classList.contains('cbx-in')){
    const box=inp.closest('.cbx');
    if(e.key==='ArrowDown'){e.preventDefault();if(box.querySelector('.cbx-list').hidden)cbxOpen(inp);else cbxMove(box,1);}
    else if(e.key==='ArrowUp'){e.preventDefault();cbxMove(box,-1);}
    else if(e.key==='Enter'){if(box._items&&box._items.length&&box._act>=0){e.preventDefault();cbxChoose(box,box._act);}}
    else if(e.key==='Escape'){cbxClose(box);}
    return;
  }
  if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();document.getElementById('gsearch').focus();}
});
document.addEventListener('pointerdown',e=>{
  const li=e.target.closest&&e.target.closest('.cbx-list li[data-i]');
  if(li){e.preventDefault();cbxChoose(li.closest('.cbx'),+li.dataset.i);return;}
  document.querySelectorAll('.cbx').forEach(b=>{if(!b.contains(e.target))cbxClose(b);});
});
document.addEventListener('focusout',e=>{const b=e.target.closest&&e.target.closest('.cbx');if(b)setTimeout(()=>{if(!b.contains(document.activeElement))cbxClose(b);},120);});

/* ---------- Tooltip ---------- */
function placeTip(e){
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;
  if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;
  tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';
}
function showTip(html,e){tip.innerHTML=html;tip.hidden=false;placeTip(e);}
function hideTip(){tip.hidden=true;}
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(esc(t.getAttribute('data-tip')).replace(/\n/g,'<br>'),e);});
document.addEventListener('pointerout',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip],.hov');if(!t)return;
  if(t.classList.contains('hov')){const xh=t.ownerSVGElement.querySelector('.xh');if(xh)xh.style.opacity=0;}
  hideTip();
});
document.addEventListener('pointermove',e=>{
  const r=e.target.closest&&e.target.closest('.hov');
  if(r){
    const c=CH[r.dataset.chart];if(!c)return;const svg=r.ownerSVGElement,bb=svg.getBoundingClientRect(),vx=(e.clientX-bb.left)/bb.width*c.W;
    let bi=0,bd=1e9;c.X.forEach((x,i)=>{const d=Math.abs(x-vx);if(d<bd){bd=d;bi=i;}});
    const xv=c.xs[bi],xh=svg.querySelector('.xh');xh.setAttribute('x1',c.X[bi]);xh.setAttribute('x2',c.X[bi]);xh.style.opacity=1;
    showTip('<b>Week '+xv+'</b><br>'+c.series.map(se=>{const p=se.pts.find(q=>q.x===xv);
      return '<span class="sw s'+se.c+'"></span>'+esc(se.short||se.name)+': <b>'+(p&&isNum(p.y)?c.fmt(p.y):'did not play')+'</b>'+(p&&p.note?' <span class="mut">'+esc(p.note)+'</span>':'');}).join('<br>'),e);
    return;
  }
  if(!tip.hidden)placeTip(e);
});

function keyPlayers(t){
  const r=(BY_TEAM[t]||[]).filter(p=>p.g>0&&p.ss);
  const top=(pos,n,f)=>r.filter(p=>p.p===pos).sort((a,b)=>f(b)-f(a)).slice(0,n);
  return [].concat(top('QB',1,p=>p.ss.att||0),top('RB',2,p=>(p.ss.car||0)+(p.ss.tgt||0)),top('WR',3,p=>p.ss.tgt||0),top('TE',1,p=>p.ss.tgt||0));
}
function lineSummary(p){
  const s=p.ss;if(!s)return 'No games yet';
  if(p.p==='QB')return fx(s.pyd,0)+' pass yds, '+fx(s.ptd,1)+' TD, '+fx(s.int,1)+' INT per game';
  if(p.p==='RB')return fx(s.car,1)+' car, '+fx(s.ryd,0)+' rush yds, '+fx(s.tgt,1)+' tgt per game';
  if(p.p==='WR'||p.p==='TE')return fx(s.tgt,1)+' tgt ('+fmtStat('tshr',s.tshr)+' share), '+fx(s.rec,1)+' rec, '+fx(s.recyd,0)+' yds per game';
  return fx(s.tkl,1)+' tackles per game';
}
function matchNote(p,opp){
  const h=DA_HEAD[p.p];if(!h||!DA[opp]||!DA[opp][p.p])return '';
  const k=h[0][0],v=DA[opp][p.p][k],r=daRank(opp,p.p,k);
  return opp+' allows '+fx(v,1)+' '+h[0][1].toLowerCase()+' per game to '+p.p+'s, '+mup(r);
}
/* rank 1 = defense allows the least. From the player's side, a high rank is a friendly matchup. */
function mup(r){if(!r)return '';const c=r>24?'rk hi':r<=8?'rk lo':'rk';return '<span class="'+c+'">'+ord(r)+' of 32'+(r>24?', a friendly matchup':r<=8?', a tough matchup':'')+'</span>';}
/* ---------- Schedule helpers: the whole season is loaded in advance ---------- */
function fmtTime(t){if(!t)return '';const [h,m]=t.split(':').map(Number);return ((h%12)||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM');}
function kick(g){return day(g.date)+(g.time?', '+fmtTime(g.time)+' ET':'');}
function shortKick(g){if(!g.date)return '';const a=g.date.split('-');const d=new Date(+a[0],+a[1]-1,+a[2]);
  return d.toLocaleDateString('en-US',{weekday:'short'})+' '+(+a[1])+'/'+(+a[2])+(g.time?' '+fmtTime(g.time).replace(':00',''):'');}
function venueTxt(g){
  const bits=[];if(g.stad)bits.push(g.stad);if(g.loc==='Neutral')bits.push('neutral site');
  if(g.roof==='dome'||g.roof==='closed')bits.push('indoors');else if(g.roof==='open')bits.push('retractable roof open');
  if(g.surf)bits.push(/grass/.test(g.surf)?'grass':'turf');return bits.join(', ');
}
function restTxt(g,t){
  const mine=g.home===t?g.hr:g.ar,theirs=g.home===t?g.ar:g.hr;if(!isNum(mine))return '\u2014';
  const d=isNum(theirs)?mine-theirs:0;
  return mine+' days'+(isNum(theirs)&&d!==0?' <span class="'+(d>=3?'rk hi':d<=-3?'rk lo':'rk')+'">('+(d>0?'+':'\u2212')+Math.abs(d)+' vs them)</span>':'');
}
/* Every week of the season for a team: its game, or null for the bye */
function teamSlate(t){const wks=[...new Set(GAMES.map(g=>g.wk))].sort((a,b)=>a-b);return wks.map(w=>({wk:w,g:GAMES.find(g=>g.wk===w&&(g.home===t||g.away===t))||null}));}
function remaining(t){return teamSlate(t).filter(r=>r.wk>=NEXT_WK&&(!r.g||!isFinal(r.g)));}
function nextTxt(t){const g=nextGame(t);if(!g)return '<span class="mut">Season over</span>';return '<a href="#/game/'+g.id+'">'+(g.home===t?'vs ':'at ')+oppOf(g,t)+'</a> <span class="mut small">'+shortKick(g)+'</span>';}
/* How tough an opponent is for this player: defense allowed to his position (offense), or opponent offense by EPA (defense). Higher = friendlier. */
function oppRank(p,o){
  if(OFF_POS.indexOf(p.p)>=0)return daRank(o,p.p,DA_HEAD[p.p][0][0]);
  if(isDef(p))return tmRank(TMK.o_epa,o);
  return null;
}
function oppNote(p,o,short){
  const r=oppRank(p,o);if(!r)return '';
  const c=r>24?'rk hi':r<=8?'rk lo':'rk';
  if(short)return '<span class="'+c+'">'+ord(r)+'</span>';
  return '<span class="'+c+'">'+(isDef(p)?'Offense '+ord(r)+' by EPA':ord(r)+' of 32')+(r>24?', friendly':r<=8?', tough':'')+'</span>';
}
/* ======================================================================
   Matchup outlook: a transparent projection for one game
   1. Start: his per-game average, blending this season with every game since the
      first history season. This season's weight grows with games played, up to half.
   2. Defense: how far this defense is above or below the league average at his
      position for that stat. Use half the gap (part of any defense number is noise),
      capped at +/-20%.
   3. Game script: the betting market's implied team total vs his team's usual
      scoring. Volume stats move 30% of that gap, touchdowns 60%, capped at +/-10%.
   Range = the middle half of his games since the first history season, after the
   same adjustments.
   ====================================================================== */
const PROJ_KEYS={QB:['att','cmp','pyd','ptd','int','ryd'],RB:['car','ryd','lru','rtd','tgt','rec','recyd','lr'],WR:['tgt','rec','recyd','lr','rectd'],TE:['tgt','rec','recyd','lr','rectd']};
const VOLUME={att:1,cmp:1,pyd:1,tgt:1,rec:1,recyd:1,car:1,ryd:1},TDK={ptd:1,rtd:1,rectd:1};
const LG={},PROJ_C={};
function lgAvg(pos,k){const ck=pos+'|'+k;if(ck in LG)return LG[ck];const v=TL.map(t=>DA[t]&&DA[t][pos]?DA[t][pos][k]:null).filter(isNum);return LG[ck]=v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function impliedPts(g,t){if(!isNum(g.total)||!isNum(g.spread))return null;return g.home===t?(g.total+g.spread)/2:(g.total-g.spread)/2;}
function project(p,g){
  const ck=p.id+'|'+g.id;if(PROJ_C[ck])return PROJ_C[ck];
  const opp=oppOf(g,p.t),games=playerGames(p),cur=games.filter(x=>x.s===SEASON),w=Math.min(cur.length,6)/12;
  const ip=impliedPts(g,p.t),pf=TS[p.t]&&TS[p.t].pfpg,ratio=isNum(ip)&&pf?ip/pf:1;
  const out={opp:opp,g:g,ip:ip,pf:pf,keys:{}};
  (PROJ_KEYS[p.p]||[]).forEach(k=>{
    const all=games.map(x=>weekVal(x,k)).filter(isNum),c=cur.map(x=>weekVal(x,k)).filter(isNum);if(!all.length)return;
    const mean=a=>a.reduce((s,v)=>s+v,0)/a.length,aAll=mean(all),aCur=c.length?mean(c):null;
    const base=aCur===null?aAll:w*aCur+(1-w)*aAll;
    const da=DA[opp]&&DA[opp][p.p]?DA[opp][p.p][k]:null,lg=lgAvg(p.p,k);
    const mf=isNum(da)&&lg?Math.min(1.2,Math.max(0.8,1+(da/lg-1)*0.5)):1;
    const sf=(VOLUME[k]||TDK[k])?Math.min(1.1,Math.max(0.9,1+(ratio-1)*(TDK[k]?0.6:0.3))):1;
    const f=mf*sf,sc=all.map(v=>v*f).sort((a,b)=>a-b),q=x=>sc[Math.round(x*(sc.length-1))];
    out.keys[k]={aAll:aAll,aCur:aCur,base:base,da:da,lg:lg,mf:mf,sf:sf,f:f,proj:base*f,lo:q(.25),hi:q(.75),n:all.length,rank:isNum(da)?daRank(opp,p.p,k):null};
  });
  return PROJ_C[ck]=out;
}
function pfmt(k,v){return isNum(v)?((TDK[k]||k==='int')?v.toFixed(2):v.toFixed(1)):'\u2014';}
function fct(x,k){if(!isNum(x))return '';const d=Math.round((x-1)*100),bad=k==='int';const good=bad?d<0:d>0;
  return '<span class="'+(Math.abs(d)>=5?(good?'rk hi':'rk lo'):'rk')+'">'+(d>0?'+':d<0?'\u2212':'\u00b1')+Math.abs(d)+'%</span>';}
const PROJ_NOTE='Start: his per-game average, blending this season with every game since '+'__H__'+' (this season counts for more as he plays more games, up to half). Then adjusted for how this defense compares with the league average at his position (half the gap, capped at 20%), and for the betting market\u2019s implied team total compared with his team\u2019s usual scoring. Range is the middle half of his games after the same adjustments. These are estimates from public data, not betting advice.';
function outlookTable(p,g){
  const pr=project(p,g),keys=Object.keys(pr.keys);if(!keys.length)return '';
  const o=pr.opp;
  let h='<p class="lede">Week '+g.wk+' '+(g.home===p.t?'vs ':'at ')+esc(fullName(o))+', '+esc(kick(g))+'.'+(isNum(pr.ip)?' The betting market expects about <b>'+pr.ip.toFixed(1)+' points</b> from '+esc(nick(p.t))+' (they average '+fx(pr.pf,1)+').':' Lines aren\u2019t posted yet, so only the defense adjusts the numbers.')+'</p>';
  h+='<div class="scroll"><table><thead><tr><th>Stat</th><th class="num">This season</th><th class="num">Since '+(HIST[0]||SEASON)+'</th><th class="num">'+o+' allows to '+p.p+'s</th><th class="num">Matchup</th><th class="num">Projection</th><th class="num">Typical range</th></tr></thead><tbody>'+
    keys.map(k=>{const x=pr.keys[k];return '<tr><td>'+glab(ST[k].l,k)+'</td><td class="num">'+pfmt(k,x.aCur)+'</td><td class="num">'+pfmt(k,x.aAll)+'</td><td class="num">'+(isNum(x.da)&&DA_ALL[p.p].some(y=>y[0]===k)?alink(o,p.p,k,pfmt(k,x.da)):pfmt(k,x.da))+(x.rank?' <span class="small">'+mup(x.rank).replace(', a friendly matchup','').replace(', a tough matchup','')+'</span>':'')+'</td><td class="num">'+fct(x.f,k)+'</td><td class="num"><b>'+pfmt(k,x.proj)+'</b></td><td class="num">'+pfmt(k,x.lo)+'\u2013'+pfmt(k,x.hi)+'</td></tr>';}).join('')+
    '</tbody></table></div><details class="tview" style="margin-top:6px"><summary>How the projection works</summary><p class="small mut" style="max-width:72ch;margin-top:6px">'+PROJ_NOTE.replace('__H__',HIST[0]||SEASON)+'</p></details>';
  return h;
}

/* ---------- Likely one-on-one pairings (by playing time and role, not charted coverage) ---------- */
function rankList(t,filter,score){return (BY_TEAM[t]||[]).filter(x=>x.g>0&&x.ss&&filter(x)).sort((a,b)=>score(b)-score(a));}
const PAIR_C={};
function likelyPairs(off,def){
  const ck=off+'|'+def;if(PAIR_C[ck])return PAIR_C[ck];
  const out=[],snap=x=>x.sn||0;
  const wr=rankList(off,x=>x.p==='WR',x=>x.ss.tgt||0).slice(0,3),cb=rankList(def,x=>isDef(x)&&pk(x)==='CB',snap);
  wr.forEach((w,i)=>{if(cb[i])out.push({o:w,d:cb[i],why:'His team\u2019s No. '+(i+1)+' receiver by targets against their No. '+(i+1)+' corner by snaps'});});
  const s=rankList(def,x=>isDef(x)&&pk(x)==='S',snap),lb=rankList(def,x=>isDef(x)&&pk(x)==='LB',snap);
  const te=rankList(off,x=>x.p==='TE',x=>x.ss.tgt||0)[0];if(te&&(s[0]||lb[0]))out.push({o:te,d:s[0]||lb[0],why:'Top tight end against their safety on the field most'});
  const rb=rankList(off,x=>x.p==='RB',x=>(x.ss.car||0)+(x.ss.tgt||0))[0];if(rb&&lb[0])out.push({o:rb,d:lb[0],why:'Lead back against their linebacker on the field most'});
  const qb=rankList(off,x=>x.p==='QB',x=>x.ss.att||0)[0],ru=rankList(def,x=>isDef(x)&&(pk(x)==='DL'||pk(x)==='LB'),x=>(x.ss.sacks||0)*2+(x.ss.qbh||0))[0];
  if(qb&&ru)out.push({o:qb,d:ru,why:'Starting QB against their top pass rusher (sacks and hits)'});
  return PAIR_C[ck]=out;
}
function pairFor(o,defTeam){
  const x=likelyPairs(o.t,defTeam).find(q=>q.o.id===o.id);if(x)return x.d;
  const g=FACES[o.p];return g?(defendersAt(defTeam,g[0][0])[0]||null):null;
}
function counterpartOf(d,offTeam){const x=likelyPairs(offTeam,d.t).find(q=>q.d.id===d.id);return x?x.o:null;}
function kpList(t,opp){
  const ps=keyPlayers(t);if(!ps.length)return '<p class="empty">No games logged yet.</p>';
  return '<ul class="kp">'+ps.map(p=>'<li><span class="pos">'+p.p+'</span><span>'+plink(p)+'</span><span class="fp">'+fx(p.ss[MAIN_PROP[p.p]],1)+' <span class="small mut">'+ST[MAIN_PROP[p.p]].s.toLowerCase()+'</span></span><span class="ln2">'+lineSummary(p)+(opp?'<br>'+matchNote(p,opp)+'<br><a href="#/compare/defense/'+p.id+'/'+opp+'">See him against '+opp+'\u2019s defenders</a>':'')+'</span></li>').join('')+'</ul>';
}
/* Every defender who has played, grouped by role, starters (most snaps) first */
function defRoster(t){

  const unitBlock=(off,def,left)=>{

  };

  h+='<h2>Players to know</h2><p class="lede">Each team’s main skill players by usage, with what the other defense allows at their position.</p><div class="split">'+
    '<div><h3>'+esc(fullName(A))+'</h3>'+kpList(A,H)+'</div><div><h3>'+esc(fullName(H))+'</h3>'+kpList(H,A)+'</div></div>';

  h+='<h2>Defenders to know</h2><p class="lede">Every defender who has played for each team this season, line to secondary, most snaps first, with percentile at his position.</p>'+
    '<h3 style="margin-top:16px">'+flag(A,'sm')+' '+esc(fullName(A))+'</h3>'+defBrief(A)+'<h3 style="margin-top:24px">'+flag(H,'sm')+' '+esc(fullName(H))+'</h3>'+defBrief(H);
  h+=meetings(A,H);
  h+='<p class="note">Injury reports and live prop lines aren’t connected yet, so check the injury report before acting on anything here.</p>';
  return h;
}
function pairsTable(off,def){

function daCompareTable(A,B){

function meetings(A,B){
  const all=GAMES.filter(g=>isFinal(g)&&((g.home===A&&g.away===B)||(g.home===B&&g.away===A))).map(g=>({s:SEASON,wk:g.wk,gt:'REG',home:g.home,away:g.away,hs:g.hs,as:g.as}))
    .concat(PAST.filter(g=>(g.home===A&&g.away===B)||(g.home===B&&g.away===A))).sort((x,y)=>y.s-x.s||y.wk-x.wk);
  let h='<h2>Head to head</h2>';
  if(!all.length)return h+'<p class="empty">These teams haven’t played each other since '+(HIST[0]||SEASON)+'.</p>';
  let wa=0,wb=0;all.forEach(g=>{const ws=g.hs>g.as?g.home:g.as>g.hs?g.away:null;if(ws===A)wa++;else if(ws===B)wb++;});
  h+='<p class="lede">'+A+' '+wa+', '+B+' '+wb+' since '+(HIST[0]||SEASON)+'.</p><div class="scroll"><table><thead><tr><th>Season</th><th>Week</th><th>Matchup</th><th class="num">Score</th><th>Winner</th></tr></thead><tbody>'+
    all.map(g=>{const w=g.hs>g.as?g.home:g.as>g.hs?g.away:'Tie';return '<tr><td>'+g.s+'</td><td>'+(g.gt&&g.gt!=='REG'?g.gt:g.wk)+'</td><td>'+tt(g.away)+' at '+tt(g.home)+'</td><td class="num">'+g.as+'–'+g.hs+'</td><td>'+(w==='Tie'?'Tie':tt(w))+'</td></tr>';}).join('')+'</tbody></table></div>';
  return h;
}

/* Strength of the remaining schedule: combined current record of opponents still to play */
function sosLeft(t){
  const r=remaining(t).filter(x=>x.g);if(!r.length)return null;let w=0,l=0,ti=0;
  r.forEach(x=>{const s=TS[oppOf(x.g,t)];if(s){w+=s.w;l+=s.l;ti+=s.t;}});
  const pct=(w+l+ti)?(w+ti*.5)/(w+l+ti):null;
  return {w,l,t:ti,pct,n:r.length,txt:w+'-'+l+(ti?'-'+ti:'')+(isNum(pct)?' <span class="mut small">('+pct.toFixed(3).replace(/^0/,'')+')</span>':'')};
}

    '</tbody></table></div><p class="count">Spread is the record against the closing line (covers, misses, pushes). Over/under is games over, under and pushes against the closing total. Opponents left is the combined record of every team still on the schedule.</p>';

  return h;

function plCols(){return PL.pos&&LIST_KEYS[PL.pos]?LIST_KEYS[PL.pos]:['scy','tdt','fp'];}
function plRows(){
  const toks=PL.q.toLowerCase().split(/\s+/).filter(Boolean);
  let list=PLAYERS.filter(p=>(!PL.pos||pk(p)===PL.pos)&&(!PL.team||p.t===PL.team)&&(!toks.length||toks.every(t=>(p.n+' '+p.t+' '+nick(p.t)+' '+p.p).toLowerCase().indexOf(t)>=0)));
  const k=PL.sort,dir=PL.dir;
  const get=p=>k==='n'?p.n:k==='g'?p.g:k==='sn'?(isNum(p.sn)?p.sn:-1):(p.ss&&isNum(p.ss[k])?p.ss[k]:-1e9);
  list.sort((a,b)=>{const x=get(a),y=get(b);if(k==='n')return x<y?-dir:x>y?dir:0;return (x-y)*dir||(a.n<b.n?-1:1);});
  return list;
}

/* ---------- Player page ---------- */
function weekVal(w,k){if(!w)return null;const v=w[k];if(!isNum(v))return (k==='lr'||k==='lru')?0:null;return k==='tshr'?v*100:v;}
function weekFmt(k){return v=>isNum(v)?(k==='tshr'?v.toFixed(0)+'%':(Number.isInteger(v)?String(v):v.toFixed(1))):'—';}
/* Every regular-season game we have for him, oldest first. Offense: every game since the
   first history season. Defense: this season's game log (earlier seasons are in the season table). */
function playerGames(p){
  if(!isDef(p)&&p.hist&&p.hist.length)return p.hist.slice().sort((a,b)=>a.s-b.s||a.w-b.w);
  return (p.wk||[]).map(w=>Object.assign({s:SEASON},w));
}
function spanGames(p,span){const g=playerGames(p);return span==='all'?g:g.filter(x=>x.s===+span);}
function spanName(span){return span==='all'?'since '+(HIST[0]||SEASON):'in '+span;}
function defaultLineVals(v){if(!v.length)return 0.5;const avg=v.reduce((a,b)=>a+b,0)/v.length,r=Math.round(avg*2)/2;return Math.max(0.5,r%1===0?r-0.5:r);}
function gbHTML(p){
  const k=PV.key,f=weekFmt(k);
  const pts=spanGames(p,PV.span).map(w=>({s:w.s,w:w.w,opp:w.opp,y:weekVal(w,k)})).filter(q=>isNum(q.y));
  const lk=p.id+'|'+k+'|'+PV.span;if(!isNum(PV.line[lk]))PV.line[lk]=defaultLineVals(pts.map(q=>q.y));
  const line=PV.line[lk],over=pts.filter(q=>q.y>line).length,push=pts.filter(q=>q.y===line).length;
  const seen=[...new Set(pts.map(q=>q.s))];
  let txt='<b>Over '+f(line)+' in '+over+' of '+pts.length+' games '+(seen.length>1?spanName(PV.span):seen[0]===SEASON?'this season':'in '+seen[0])+'</b>'+(push?', '+push+' push':'');
  if(PV.span==='all'){const cur=pts.filter(q=>q.s===SEASON);if(cur.length&&cur.length<pts.length)txt+='. This season: '+cur.filter(q=>q.y>line).length+' of '+cur.length;}
  return '<p class="small" style="margin-top:6px">'+txt+'. Blue bars went over, pale bars stayed under.</p>'+gameBars(pts,{line:line,fmt:f,label:ST[k].l+' by game'});
}
function rowVals(v){const o=Object.assign({},v);if(o.att)o.cmpp=o.cmp/o.att*100,o.ypa=o.pyd/o.att;if(o.car)o.ypc=o.ryd/o.car;if(o.tgt)o.ypt=o.recyd/o.tgt,o.catch=o.rec/o.tgt*100;return o;}
const DEF_TABLE=['tkl','sacks','qbh','tfl','pd','int','ff'];

/* Combined line across every season we have: per-game stats weighted by games, season totals summed. */

    const tot=(ST[k]||{}).tot;let sum=0,gs=0;
    rows.forEach(r=>{const v=r.v[k];if(isNum(v)){gs+=r.g;sum+=tot?v:v*r.g;}});

function seasonTable(p){

/* ---------- Head-to-head plays (loaded on demand from nfl_h2h.json) ---------- */
let H2H=null,H2H_INV=null,H2H_SEASONS=[],H2H_P=null;
function needH2H(){
  if(H2H||H2H_P)return;
  H2H_P=fetch('nfl_h2h.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(j=>{
    H2H=j.pairs||{};H2H_SEASONS=j.seasons||[];H2H_INV={};
    Object.keys(H2H).forEach(o=>Object.keys(H2H[o]).forEach(d=>{(H2H_INV[d]=H2H_INV[d]||{})[o]=H2H[o][d];}));
  }).catch(e=>{console.error(e);H2H={};H2H_INV={};}).then(()=>render(true));
}
function pair(o,d){return H2H&&H2H[o]&&H2H[o][d]||null;}
function seasonsTxt(mask){const s=H2H_SEASONS.filter((x,i)=>mask&(1<<i));return s.length?' <span class="mut small">('+s.join(', ')+')</span>':'';}
function pairTxt(a,pos){
  if(!a)return '<span class="h2h none">No plays credited</span>';
  const n=a[0],y=a[1],td=a[2],pd=a[3],it=a[4],sk=a[5],qh=a[6],b=[],pl=(v,w)=>v+' '+w+(v===1?'':'s');
  if(pos==='QB'){if(sk)b.push((Number.isInteger(sk)?sk:sk.toFixed(1))+' sack'+(sk===1?'':'s'));if(qh)b.push(pl(qh,'hit'));if(it)b.push(it+' INT');if(pd)b.push(pd+' PD');if(!b.length)b.push(pl(n,'play'));}
  else if(pos==='RB'){b.push(pl(n,'play'));if(n)b.push(fx(y/n,1)+' yds per play');if(pd)b.push(pd+' PD');if(it)b.push(it+' INT');}
  else{b.push(pl(n,'play'));if(y)b.push(Math.round(y)+' yds on catches he tackled');if(pd)b.push(pd+' PD');if(it)b.push(it+' INT');if(td)b.push(td+' TD');}
  return '<span class="h2h">'+b.join(', ')+'</span>'+seasonsTxt(a[7]);
}

/* ---------- Compare ---------- */
function vCompare(kind,a,b){
  const tabs='<div class="seg" role="group" aria-label="Compare"><button data-ckind="players" aria-pressed="'+(kind==='players')+'">Players</button><button data-ckind="defense" aria-pressed="'+(kind==='defense')+'">Player vs defense</button><button data-ckind="duel" aria-pressed="'+(kind==='duel')+'">Player vs player</button><button data-ckind="teams" aria-pressed="'+(kind==='teams')+'">Teams</button></div>';
  const sub={duel:'One offensive player against one defender, set to the defender he\u2019s most likely to see next.',players:'Two players, side by side, ranked against everyone at their position.',teams:'Two teams, side by side, ranked against the league.',defense:'One player against every defender he could line up with, and what they’ve done against each other.'}[kind];
  const h='<section class="hero"><div><h1>Compare</h1><p class="sub">'+sub+'</p></div>'+tabs+'</section>';
  return h+(kind==='teams'?cmpTeams(a,b):kind==='defense'?cmpDefense(a,b):kind==='duel'?cmpDuel(a,b):cmpPlayers(a,b));
}
function cmpPlayers(a,b){
  const top=PLAYERS.filter(p=>p.p==='WR'&&qualifies(p)).sort((x,y)=>y.ss.fp-x.ss.fp);
  const prevA=CMP.pa;
  if(a&&BY[a])CMP.pa=a;if(b&&BY[b])CMP.pb=b;
  if(!CMP.pa||!BY[CMP.pa])CMP.pa=top[0]&&top[0].id;
  if(a&&CMP.pa===a&&CMP.pa!==prevA)picked(CMP.pa,'players');
  if(!CMP.pb||!BY[CMP.pb]||CMP.pb===CMP.pa)CMP.pb=suggestRival(BY[CMP.pa])||(top[1]&&top[1].id);
  const A=BY[CMP.pa],B=BY[CMP.pb];if(!A||!B)return '<p class="empty">Not enough player data loaded.</p>';
  let h='<div class="pickers" style="margin-top:18px"><div class="fld"><span>Player A (blue)</span>'+cbx('pA','Search a player',A.n,'pickA')+'</div><button class="btn swap" data-swap="players" aria-label="Swap players">Swap</button><div class="fld"><span>Player B (orange)</span>'+cbx('pB','Search a player',B.n,'pickB')+'</div></div>';
  const same=pk(A)===pk(B),keys=same?(POS_KEYS[pk(A)]||['fp']):['fp'],span=CMP.span;
  const va=span==='all'?(spanAll(A)||{}):(A.ss||{}),vb=span==='all'?(spanAll(B)||{}):(B.ss||{});
  const lead=[0,0];
  const rows=keys.map(k=>{

  h+='<div class="cmp-head"><div class="cmp-card A"><h3><a href="#/player/'+O.id+'">'+esc(O.n)+'</a></h3><p>'+flag(O.t,'sm')+' '+O.p+', '+esc(fullName(O.t))+'</p><p class="score">'+lineSummary(O)+'</p></div><span class="vs">vs</span>'+
    '<div class="cmp-card B"><h3><a href="#/player/'+D.id+'">'+esc(D.n)+'</a></h3><p>'+flag(D.t,'sm')+' '+esc(posLabel(D))+', '+esc(fullName(D.t))+(isNum(D.sn)?', '+D.sn+'% of snaps':'')+'</p><p class="score">'+lineSummary(D)+'</p></div></div>';
  h+='<p class="note" style="margin-top:12px">'+(meet?(meet===ng?'They meet next: ':'Next time they meet: ')+'week '+meet.wk+', '+esc(kick(meet))+'. ':'Their teams don\u2019t meet again this season. ')+
    (lk&&lk.id===D.id?esc(D.n)+' is the most likely one-on-one for '+esc(O.n)+' by playing time and role. ':'')+'Coverage assignments aren\u2019t in free data, so this pairs players by role; it doesn\u2019t confirm who covers whom.</p>';
  h+='<h2>Head to head since '+(HIST[0]||SEASON)+'</h2><div class="duel solo"><div class="mid"><p class="small mut">Credited plays against each other</p><p class="big">'+(H2H?(a?a[0]:0):'\u2026')+'</p><p>'+(H2H?pairTxt(a,O.p):'Loading\u2026')+'</p></div></div><p class="small mut" style="margin-top:8px">'+CREDIT_NOTE+'</p>';
  const vk=(VS_KEYS[O.p]||[]).filter(k=>D.ss&&k in D.ss);
  if(vk.length)h+='<h2>How '+esc(D.n)+' handles '+O.p+'s</h2><p class="lede">This season, ranked against other '+(ROLE_NAME[pk(D)]||pk(D))+'.</p><dl class="tiles">'+vk.map(k=>tileFor(D,k)).join('')+'</dl>';
  h+='<h2>Side by side</h2><div class="split" style="margin-top:10px"><div><h3><span class="sw sA"></span>'+esc(O.n)+'</h3><dl class="tiles">'+(POS_KEYS[O.p]||[]).map(k=>tileFor(O,k)).join('')+'</dl></div>'+
    '<div><h3><span class="sw sB"></span>'+esc(D.n)+'</h3><dl class="tiles">'+(POS_KEYS[pk(D)]||[]).map(k=>tileFor(D,k)).join('')+'</dl></div></div>';
  if(meet)h+='<h2>Outlook for '+(meet===ng?'their next game':'week '+meet.wk)+'</h2>'+outlookTable(O,meet);
  if(nopp){const ps=likelyPairs(O.t,nopp);if(ps.length)h+='<h2>Other likely one-on-ones in week '+ng.wk+'</h2>'+pairsTable(O.t,nopp);}
  return h;
}

/* ---------- Outlook: every player's projection for any week ahead ---------- */
const OL={wk:null,pos:'WR',sort:null,dir:-1};
const OL_COLS={QB:['att','cmp','pyd','ptd','int','ryd'],RB:['car','ryd','lru','rtd','rec','recyd','lr'],WR:['tgt','rec','recyd','lr','rectd'],TE:['tgt','rec','recyd','lr','rectd']};
const MAIN={QB:'pyd',RB:'ryd',WR:'recyd',TE:'recyd'};
function vOutlook(){
  const wks=[...new Set(GAMES.filter(g=>!isFinal(g)).map(g=>g.wk))].sort((a,b)=>a-b);
  let h='<section class="hero"><div><h1>Outlook</h1><p class="sub">Projected numbers for every player in any game left on the schedule, built from his full sample since '+(HIST[0]||SEASON)+' and adjusted for the defense he faces and the betting lines.</p></div></section>';
  if(!wks.length)return h+'<p class="empty">No games left this season.</p>';
  /* if this week has only a game or two left (e.g. just Monday night), open on the next full week */
  if(!OL.wk||wks.indexOf(OL.wk)<0){const left=w=>GAMES.filter(g=>g.wk===w&&!isFinal(g)).length;OL.wk=left(wks[0])<4&&wks[1]?wks[1]:wks[0];}
  const pos=OL.pos,cols=OL_COLS[pos],main=MAIN[pos];if(!OL.sort||(cols.indexOf(OL.sort)<0&&OL.sort!=='boost'&&OL.sort!=='n'))OL.sort=main;
  const rows=PLAYERS.filter(p=>p.p===pos&&qualifies(p)).map(p=>{const g=GAMES.find(x=>x.wk===OL.wk&&!isFinal(x)&&(x.home===p.t||x.away===p.t));return g?{p:p,g:g,pr:project(p,g)}:null;}).filter(Boolean);
  const val=r=>OL.sort==='n'?r.p.n:OL.sort==='boost'?((r.pr.keys[main]||{}).f||0):((r.pr.keys[OL.sort]||{}).proj||-1);
  rows.sort((a,b)=>{const x=val(a),y=val(b);if(OL.sort==='n')return (x<y?-1:x>y?1:0)*-OL.dir;return (y-x)*-OL.dir||(a.p.n<b.p.n?-1:1);});
  const gs=GAMES.filter(g=>g.wk===OL.wk),dates=gs.map(g=>g.date).sort(),playing=new Set();gs.forEach(g=>{playing.add(g.home);playing.add(g.away);});
  const bye=TL.filter(t=>!playing.has(t));
  h+='<div class="row" style="margin-top:18px;align-items:flex-end"><label class="fld">Week<select id="olWk" class="sel">'+wks.map(w=>{const d=GAMES.filter(g=>g.wk===w).map(g=>g.date).sort();return '<option value="'+w+'"'+(w===OL.wk?' selected':'')+'>Week '+w+' ('+shortDay(d[0])+(d.length>1?' to '+shortDay(d[d.length-1]):'')+')</option>';}).join('')+'</select></label>'+
    '<div class="chips" role="group" aria-label="Position">'+['QB','RB','WR','TE'].map(x=>'<button data-olpos="'+x+'" aria-pressed="'+(x===pos)+'">'+x+'</button>').join('')+'</div></div>';
  h+='<p class="count">'+rows.length+' '+(ROLE_NAME[pos]||pos)+' with a real role play in week '+OL.wk+(bye.length?'. On bye: '+bye.join(', '):'')+'. Projections are per game; \u201cMatchup\u201d is how much the defense and the betting lines move his '+ST[main].l.toLowerCase()+'.</p>';
  const th=(k,l,num)=>'<th'+(num?' class="num"':'')+(OL.sort===k?' aria-sort="'+(OL.dir>0?'ascending':'descending')+'"':'')+'><button data-olsort="'+k+'">'+l+'</button></th>';
  h+='<div class="scroll"><table><thead><tr>'+th('n','Player')+'<th>Opponent</th>'+th('boost','Matchup',1)+cols.map(k=>th(k,ST[k].s,1)).join('')+'<th>Likely one-on-one</th><th><span class="sr">Details</span></th></tr></thead><tbody>'+
    rows.map(r=>{const o=r.pr.opp,mk=r.pr.keys[main],lk=pairFor(r.p,o);
      return '<tr><td>'+plink(r.p)+' <span class="mut small">'+flag(r.p.t,'sm')+' '+r.p.t+'</span></td><td>'+(r.g.home===r.p.t?'vs ':'at ')+tt(o)+' <span class="mut small">'+shortKick(r.g)+'</span></td><td class="num">'+(mk?fct(mk.f,main):'')+'</td>'+
        cols.map(k=>{const x=r.pr.keys[k];return '<td class="num">'+(x?(k===OL.sort?'<b>'+pfmt(k,x.proj)+'</b>':pfmt(k,x.proj)):'\u2014')+'</td>';}).join('')+
        '<td>'+(lk?'<a href="#/compare/duel/'+r.p.id+'/'+lk.id+'">'+esc(lk.n)+'</a> <span class="mut small">'+esc(posLabel(lk))+'</span>':'')+'</td><td><a class="small" href="#/compare/defense/'+r.p.id+'/'+o+'">Details</a></td></tr>';}).join('')+
    '</tbody></table></div><details class="tview" style="margin-top:8px"><summary>How the projections work</summary><p class="small mut" style="max-width:72ch;margin-top:6px">'+PROJ_NOTE.replace('__H__',HIST[0]||SEASON)+'</p></details>';
  return h;
}

/* ======================================================================
   Stat leaders: every position, season totals or per game.
   Totals are summed from the weekly log, so totals and per-game always agree.

                c = count of games (milestones), m = single-game best (longest)
   ====================================================================== */
const LD={mode:'tot',pos:''};
const LB_GROUPS=[
  {id:'passing',l:'Passing',pos:['QB'],ok:p=>p.p==='QB',boards:[['pyd','Passing yards'],['ptd','Passing TDs'],['cmp','Completions'],['att','Pass attempts'],['int','Interceptions thrown'],['cmpp','Completion rate','r'],['ypa','Yards per attempt','r'],['pepa','Passing EPA'],['g300','300-yard passing games','c']]},
  {id:'rushing',l:'Rushing',pos:['RB','QB','WR'],ok:p=>OFF_POS.indexOf(p.p)>=0,boards:[['ryd','Rushing yards'],['rtd','Rushing TDs'],['car','Carries'],['ypc','Yards per carry','r'],['lru','Longest run','m'],['g100r','100-yard rushing games','c']]},
  {id:'receiving',l:'Receiving',pos:['WR','TE','RB'],ok:p=>OFF_POS.indexOf(p.p)>=0&&p.p!=='QB',boards:[['rec','Receptions'],['recyd','Receiving yards'],['rectd','Receiving TDs'],['tgt','Targets'],['tshr','Target share','r'],['ypt','Yards per target','r'],['lr','Longest reception','m'],['g100c','100-yard receiving games','c']]},
  {id:'scrimmage',l:'Scrimmage',pos:['RB','WR','TE','QB'],ok:p=>OFF_POS.indexOf(p.p)>=0,boards:[['scy','Yards from scrimmage'],['tdt','Rushing and receiving TDs']]},
  {id:'defense',l:'Defense',pos:['DL','LB','CB','S'],ok:p=>isDef(p),boards:[['tkl','Tackles'],['sacks','Sacks'],['int','Interceptions'],['pd','Passes defended'],['tfl','Tackles for loss'],['qbh','QB hits'],['ff','Forced fumbles']]},
  {id:'fantasy',l:'Fantasy',pos:['QB','RB','WR','TE'],ok:p=>OFF_POS.indexOf(p.p)>=0,boards:[['fp','Fantasy points (PPR)']]}

const LBG={};LB_GROUPS.forEach(g=>LBG[g.id]=g);
const LD_C={};
function ldTot(p){
  if(LD_C[p.id])return LD_C[p.id];

  wk.forEach(w=>{
    for(const k in w){if(k==='w'||k==='opp'||k==='v'||k==='lr'||k==='lru'||k==='tshr')continue;const v=w[k];if(isNum(v))t[k]=(t[k]||0)+v;}
    if((w.pyd||0)>=300)t.g300++;if((w.ryd||0)>=100)t.g100r++;if((w.recyd||0)>=100)t.g100c++;
    if(isNum(w.lr))t.lr=Math.max(t.lr,w.lr);if(isNum(w.lru))t.lru=Math.max(t.lru,w.lru);

const LD_MIN={cmpp:['att',14,'pass attempts'],ypa:['att',14,'pass attempts'],ypc:['car',6.25,'carries'],ypt:['tgt',3.5,'targets'],tshr:['tgt',3.5,'targets']};

    .map(p=>({p:p,v:ldVal(p,k,fl)})).filter(x=>isNum(x.v)&&x.v>0)
